<main id="dashboard"></main>

<script type="module">

if(location.protocol === "file:"){

document.body.innerHTML = `
<div style="padding:40px;font-family:Arial,sans-serif;background:#16181f;color:#fff;max-width:520px">
<h2>Нужен локальный сервер</h2>
<p>Страницу нельзя открывать двойным кликом по файлу.</p>
<p>В терминале:</p>
<pre style="background:#1f2937;padding:12px;border-radius:8px">cd crypto-terminal-v2
./start.sh</pre>
<p>Затем откройте:<br>
<a href="http://127.0.0.1:8080/watchlist.html" style="color:#60a5fa">http://127.0.0.1:8080/watchlist.html</a>
</p>
</div>`;

}else{

try{

if(
window.waitForSiteCssReady
){
await window.waitForSiteCssReady();
}

let tradeBoot =
null;

if(
window.cryptoTerminalDesktop?.isDesktop
){
tradeBoot =
await import("/js/trade-desktop-boot.js?v=16");

if(
tradeBoot.isWatchlistTradeMode()
){
await tradeBoot.initTradeDesktopBeforeChart(
{
mode:
"watchlist"
}
);
}
}

const { loadLightweightCharts } =
await import("/js/charts-lib-boot.js?v=3");

await loadLightweightCharts();
await import("./js/watchlist.js?v=94");

if(
tradeBoot?.isWatchlistTradeMode()
){
await tradeBoot.initTradeDesktopAfterChart(
{
mode:
"watchlist"
}
);
}

await import("./js/watchlist-page.js?v=3");
import("/js/site-boot.js?v=92").catch(err=>{
console.warn("site-boot:", err);
});

}catch(err){

console.error(err);

const msg =
String(
err?.message ||
err
);

const exportHint =
/export/i.test(msg)
? "<p>Обычно это кэш или открытие без сервера. Запустите <code>./start.sh</code>, откройте ссылку ниже и сделайте жёсткое обновление (Cmd+Shift+R).</p>"
: "";

document.body.innerHTML = `
<div style="padding:32px;font-family:Arial,sans-serif;background:#16181f;color:#fff;max-width:520px">
<h2>Не удалось загрузить графики</h2>
<p style="color:#fca5a5">${msg}</p>
${exportHint}
<p>Запустите <code>./start.sh</code> и откройте <a href="http://127.0.0.1:8080/watchlist.html" style="color:#60a5fa">http://127.0.0.1:8080/watchlist.html</a></p>
</div>`;

}

}

</script>
