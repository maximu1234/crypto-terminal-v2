<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="robots" content="noindex, nofollow"/>

<title>Маркеры сделок — тест</title>

<link rel="icon" href="data:,">

<link rel="stylesheet" href="/css/critical-shell.css?v=9">
<script src="/js/site-css-ready.js?v=3"></script>
<link rel="stylesheet" href="/css/common.css?v=49">
<link rel="stylesheet" href="/css/trade-markers-test.css?v=1">

</head>

<body class="trade-markers-test-page">

<header class="trade-markers-test-header">
<a href="/screener.html" class="trade-markers-test-logo">Multichart</a>
<span class="trade-markers-test-badge">sandbox · маркеры сделок</span>
</header>

<div id="trade-markers-test-gate" class="trade-markers-test-gate hidden">
<h1>Только desktop</h1>
<p>Тестовая страница маркеров работает в приложении Multichart с подключёнными API-ключами Bybit.</p>
</div>

<main id="trade-markers-test-app" class="trade-markers-test-app hidden">

<div class="trade-markers-test-toolbar">

<div class="trade-markers-test-symbol">
<strong>ETHUSDT.P</strong>
<span class="trade-markers-test-symbol-sub">linear perpetual</span>
</div>

<div id="trade-markers-test-tf" class="trade-markers-test-tf" role="toolbar" aria-label="Таймфрейм">
<button type="button" class="trade-markers-test-tf-btn" data-tf="15">15m</button>
<button type="button" class="trade-markers-test-tf-btn" data-tf="60">1h</button>
<button type="button" class="trade-markers-test-tf-btn active" data-tf="240">4h</button>
<button type="button" class="trade-markers-test-tf-btn" data-tf="D">1D</button>
</div>

<label class="trade-markers-test-toggle" title="Показать историю сделок на графике">
<input type="checkbox" id="trade-markers-test-show" />
<span>Показать историю сделок</span>
</label>

<button type="button" id="trade-markers-test-refresh" class="trade-markers-test-refresh">Обновить</button>

</div>

<p id="trade-markers-test-status" class="trade-markers-test-status" aria-live="polite"></p>

<div id="trade-markers-test-chart-wrap" class="trade-markers-test-chart-wrap">
<div id="trade-markers-test-chart" class="trade-markers-test-chart" aria-label="ETHUSDT.P"></div>
</div>

</main>

<script type="module">
try{
await import("/js/trade-markers-sandbox/boot.js?v=5");
}catch(
err
){
console.error(
err
);
const st =
document.getElementById(
"trade-markers-test-status"
);
if(
st
){
st.textContent =
err?.message ||
String(
err
);
st.classList.add(
"is-error"
);
}
}
</script>

</body>
</html>
