[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Amsterdam — Bybit REST не режет CloudFront (в US часто 403).
# Railway region id: ams (не europe-west4-drams3a — валидатор Config Error).
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[deploy.multiRegionConfig.ams]
numReplicas = 1
