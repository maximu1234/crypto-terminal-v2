<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Crypto Terminal V2</title>

<style>
body{
  margin:0;
  background:#0b1220;
  color:white;
  font-family:Arial,sans-serif;
  padding:20px;
}

h1{
  text-align:center;
  margin-bottom:20px;
}

.topbar{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-bottom:20px;
}

.topbar button{
  background:#2563eb;
  border:none;
  color:white;
  padding:10px 16px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.grid{
  display:grid;
  gap:20px;
}

.grid-4{
  grid-template-columns:repeat(2,1fr);
}

.grid-6{
  grid-template-columns:repeat(3,1fr);
}

.grid-8{
  grid-template-columns:repeat(4,1fr);
}

.card{
  background:#111827;
  border:1px solid #1f2937;
  border-radius:12px;
  overflow:hidden;
}

.toolbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px;
  border-bottom:1px solid #1f2937;
  background:#0f172a;
}

.left-controls{
  display:flex;
  gap:10px;
  align-items:center;
}

input{
  background:#0b1220;
  color:white;
  border:none;
  padding:8px 10px;
  border-radius:6px;
  width:110px;
}

button{
  cursor:pointer;
}

.load-btn{
  background:#2563eb;
  color:white;
  border:none;
  padding:8px 12px;
  border-radius:6px;
}

.alert-btn{
  background:#dc2626;
  color:white;
  border:none;
  padding:8px 12px;
  border-radius:6px;
}

.live{
  color:#22c55e;
  font-size:12px;
  font-weight:bold;
}

.chart{
  height:400px;
}

@media(max-width:1200px){
  .grid-6,.grid-8{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:700px){
  .grid-4,.grid-6,.grid-8{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<h1>CRYPTO TERMINAL V2 🚀</h1>

<div class="topbar">
  <button onclick="setLayout(4)">4 Charts</button>
  <button onclick="setLayout(6)">6 Charts</button>
  <button onclick="setLayout(8)">8 Charts</button>
</div>

<div id="grid" class="grid"></div>

<script src="https://s3.tradingview.com/tv.js"></script>

<script>
const defaults = [
  "BTCUSDT",
  "ETHUSDT",
  "SOLUSDT",
  "XRPUSDT",
  "DOGEUSDT",
  "ADAUSDT",
  "AVAXUSDT",
  "LINKUSDT"
];

let currentLayout = parseInt(localStorage.getItem("layout")) || 4;

function saveLayout(){
  localStorage.setItem("layout", currentLayout);
}

function getSymbol(index){
  return localStorage.getItem("symbol_" + index) || defaults[index];
}

function saveSymbol(index,symbol){
  localStorage.setItem("symbol_" + index, symbol);
}

function createCard(index){
  const symbol = getSymbol(index);

  return `
    <div class="card">
      <div class="toolbar">
        <div class="left-controls">
          <input id="symbol${index}" value="${symbol}" />
          <button class="load-btn" onclick="reloadChart(${index})">LOAD</button>
          <button class="alert-btn" onclick="createAlert(${index})">ALERT</button>
        </div>

        <div class="live">LIVE</div>
      </div>

      <div id="chart${index}" class="chart"></div>
    </div>
  `;
}

function render(){
  const grid = document.getElementById("grid");

  grid.className = "grid grid-" + currentLayout;

  let html = "";

  for(let i=0;i<currentLayout;i++){
    html += createCard(i);
  }

  grid.innerHTML = html;

  for(let i=0;i<currentLayout;i++){
    loadChart(i);
  }

  saveLayout();
}

function loadChart(index){
  const symbol = getSymbol(index);

  new TradingView.widget({
    autosize: true,
    symbol: "BYBIT:" + symbol + ".P",
    interval: "15",
    timezone: "Etc/UTC",
    theme: "dark",
    style: "1",
    locale: "en",
    toolbar_bg: "#0f172a",
    enable_publishing: false,
    allow_symbol_change: true,
    hide_side_toolbar: false,
    withdateranges: true,
    details: true,
    studies: [
      "RSI@tv-basicstudies"
    ],
    container_id: "chart" + index
  });
}

function reloadChart(index){
  const symbol = document.getElementById("symbol" + index).value.toUpperCase();

  saveSymbol(index, symbol);

  document.getElementById("chart" + index).innerHTML = "";

  loadChart(index);
}

function setLayout(count){
  currentLayout = count;
  render();
}

function createAlert(index){
  const symbol = getSymbol(index);

  const price = prompt("Set alert price for " + symbol);

  if(!price) return;

  let alerts = JSON.parse(localStorage.getItem("alerts") || "[]");

  alerts.push({
    symbol,
    price
  });

  localStorage.setItem("alerts", JSON.stringify(alerts));

  alert("Alert saved for " + symbol + " at " + price);
}

render();
</script>

</body>
</html>
