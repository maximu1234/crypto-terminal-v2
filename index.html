<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Multichart Fix</title>

<style>
body{
  margin:0;
  background:#0b1220;
  color:white;
  font-family:Arial;
  height:100vh;
  display:flex;
  flex-direction:column;
}

.header{
  padding:10px;
  border-bottom:1px solid #1f2937;
}

#chart{
  flex:1;
}

button{
  margin:5px;
  padding:6px 12px;
  background:#2563eb;
  color:white;
  border:none;
  border-radius:6px;
}
</style>
</head>

<body>

<div class="header">
  <button onclick="set('BTCUSDT')">BTC</button>
  <button onclick="set('ETHUSDT')">ETH</button>
  <button onclick="set('SOLUSDT')">SOL</button>
  <button onclick="set('XRPUSDT')">XRP</button>
</div>

<div id="chart"></div>

<script src="https://s3.tradingview.com/tv.js"></script>

<script>

let widget;

function create(symbol){

  if(widget){
    widget.remove();
  }

  widget = new TradingView.widget({

    autosize:true,
    symbol:"BYBIT:"+symbol,
    interval:"15",
    timezone:"Etc/UTC",
    theme:"dark",
    style:"1",
    locale:"en",

    allow_symbol_change:true,

    hide_side_toolbar:true,
    hide_top_toolbar:false,

    disabled_features:[
      "volume_force_overlay",
      "create_volume_indicator_by_default",
      "header_compare",
      "header_symbol_search",
      "left_toolbar"
    ],

    studies: [],
    container_id:"chart"
  });

  localStorage.setItem("symbol",symbol);

  widget.onChartReady(() => {
    const chart = widget.activeChart();

    // 🔥 ВОТ ГЛАВНЫЙ ФИКС LOG
    setTimeout(() => {
      try {
        chart.setPriceScale("logarithmic");
      } catch(e) {
        console.log("log set failed", e);
      }
    }, 300);
  });
}

function set(s){
  create(s);
}

window.onload = ()=>{
  create(localStorage.getItem("symbol") || "BTCUSDT");
};

</script>

</body>
</html>
