<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin/>
<link rel="dns-prefetch" href="https://api.bybit.com"/>

<title>Главная — Multichart</title>

<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/screener.css?v=4">

</head>

<body>

<header id="header">

<div id="logo">Multichart</div>

<nav class="menu">
<a href="/index.html" class="active">Главная</a>
<a href="/coins.html">Монеты</a>
<a href="/terminal.html">Терминал</a>
<a href="/alerts/">Алерты</a>
<a href="/listings.html">Листинги</a>
<a href="/trade-calculator.html">Калькулятор</a>
<div class="header-settings-wrap hidden" id="header-settings-wrap">
<button type="button" class="header-settings-btn" id="header-settings-btn" title="Настройки" aria-label="Настройки" aria-expanded="false" aria-haspopup="true">
<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M11.078 2.25c-.917 0-1.699.663-1.85 1.567L9.05 4.889c-.878.178-1.719.436-2.515.771L4.162 4.57a1.875 1.875 0 0 0-2.615 2.615l1.09 1.374c-.335.796-.593 1.637-.771 2.515l-1.072 1.178c-.178.917.663 1.699 1.567 1.85l1.178 1.072c.178.878.436 1.719.771 2.515l-1.09 1.374a1.875 1.875 0 0 0 2.615 2.615l1.374-1.09c.796.335 1.637.593 2.515.771l1.178 1.072c.917.178 1.699-.663 1.85-1.567l1.072-1.178c.878-.178 1.719-.436 2.515-.771l1.374 1.09a1.875 1.875 0 0 0 2.615-2.615l-1.09-1.374c.335-.796.593-1.637.771-2.515l1.072-1.178c.178-.917-.663-1.699-1.567-1.85l-1.178-1.072a13.803 13.803 0 0 0-.771-2.515l1.09-1.374a1.875 1.875 0 0 0-2.615-2.615l-1.374 1.09a13.803 13.803 0 0 0-2.515-.771L11.078 2.25ZM12 15.75a3.75 3.75 0 1 0 0-7.5 3.75 3.75 0 0 0 0 7.5Z" clip-rule="evenodd"/></svg>
</button>
<div class="header-settings-dropdown hidden" id="header-settings-dropdown" role="menu">
<p class="header-settings-section-title">Синхронизация</p>
<div id="cloud-settings-mount"></div>
</div>
</div>
</nav>

<div id="header-controls">

<div class="control-group">
<span class="control-label">Виджеты</span>
<button class="layout-btn" data-layout="4" type="button">4</button>
<button class="layout-btn" data-layout="6" type="button">6</button>
<button class="layout-btn active" data-layout="9" type="button">9</button>
</div>

<div class="control-group">
<span class="control-label">Сортировка</span>
<button class="sort-btn active" data-sort="change24" type="button">24ч %</button>
<button class="sort-btn" data-sort="symbol" type="button">А–Я</button>
</div>

<div class="control-group">
<span class="control-label">Таймфрейм</span>
<button class="tf-btn" data-tf="1" type="button">1m</button>
<button class="tf-btn" data-tf="5" type="button">5m</button>
<button class="tf-btn active" data-tf="15" type="button">15m</button>
<button class="tf-btn" data-tf="60" type="button">1h</button>
<button class="tf-btn" data-tf="240" type="button">4h</button>
<button class="tf-btn" data-tf="D" type="button">1D</button>
</div>

</div>

</header>

<main id="screener-grid" class="grid-9" aria-live="polite"></main>

<footer id="pagination" aria-label="Страницы"></footer>

<div id="screener-status" class="hidden">Загрузка…</div>

<script type="module">

import { loadLightweightCharts } from "./js/charts-lib-boot.js";

loadLightweightCharts().then(async ()=>{

await import("./js/site-boot.js?v=14");
await import("./js/screener.js?v=35");

}).catch(err=>{

console.error(err);

document.body.innerHTML = `
<div style="padding:32px;font-family:Arial,sans-serif;background:#0b1220;color:#fff;max-width:520px">
<h2>Не удалось загрузить графики</h2>
<p style="color:#fca5a5">${err.message}</p>
<p>Запустите <code>./start.sh</code> и откройте <a href="/index.html" style="color:#60a5fa">/index.html</a></p>
</div>`;

});

</script>

</body>
</html>
