<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin/>
<link rel="dns-prefetch" href="https://api.bybit.com"/>

<title>Главная — Multichart</title>

<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/screener.css">

</head>

<body>

<header id="header">

<div id="logo">Multichart</div>

<nav class="menu">
<a href="/index.html" class="active">Главная</a>
<a href="/coins.html">Монеты</a>
<a href="/terminal.html">Терминал</a>
<a href="/alerts/">Алерты</a>
<a href="/trade-calculator.html">Калькулятор</a>
</nav>

<div id="header-controls">

<div class="control-group">
<span class="control-label">Виджеты</span>
<button class="layout-btn" data-layout="4" type="button">4</button>
<button class="layout-btn" data-layout="6" type="button">6</button>
<button class="layout-btn active" data-layout="9" type="button">9</button>
</div>

<div class="control-group">
<span class="control-label">Сортировка</span>
<button class="sort-btn active" data-sort="change24" type="button">24ч %</button>
<button class="sort-btn" data-sort="symbol" type="button">А–Я</button>
</div>

<div class="control-group">
<span class="control-label">Таймфрейм</span>
<button class="tf-btn" data-tf="1" type="button">1m</button>
<button class="tf-btn" data-tf="5" type="button">5m</button>
<button class="tf-btn active" data-tf="15" type="button">15m</button>
<button class="tf-btn" data-tf="60" type="button">1h</button>
<button class="tf-btn" data-tf="240" type="button">4h</button>
<button class="tf-btn" data-tf="D" type="button">1D</button>
</div>

</div>

</header>

<main id="screener-grid" class="grid-9" aria-live="polite"></main>

<footer id="pagination" aria-label="Страницы"></footer>

<div id="screener-status" class="hidden">Загрузка…</div>

<script type="module">

import { loadLightweightCharts } from "./js/charts-lib-boot.js";

loadLightweightCharts().then(async ()=>{

await import("./js/site-boot.js?v=13");
await import("./js/screener.js?v=27");

}).catch(err=>{

console.error(err);

document.body.innerHTML = `
<div style="padding:32px;font-family:Arial,sans-serif;background:#0b1220;color:#fff;max-width:520px">
<h2>Не удалось загрузить графики</h2>
<p style="color:#fca5a5">${err.message}</p>
<p>Запустите <code>./start.sh</code> и откройте <a href="/index.html" style="color:#60a5fa">/index.html</a></p>
</div>`;

});

</script>

</body>
</html>
