<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Crypto Terminal V5</title>

<style>
* { box-sizing: border-box; }

body{
  margin:0;
  background:#0b1220;
  color:white;
  font-family:Arial,sans-serif;
  padding:12px;
}

h1{
  text-align:center;
  margin:0 0 14px 0;
  font-size:22px;
}

.topbar{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-bottom:14px;
}

.topbar button{
  background:#2563eb;
  border:none;
  color:white;
  padding:10px 16px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.topbar button:hover{
  opacity:0.9;
}

.grid{
  display:grid;
  gap:12px;
}

.grid-4{ grid-template-columns:repeat(2,1fr); }
.grid-6{ grid-template-columns:repeat(3,1fr); }
.grid-9{ grid-template-columns:repeat(3,1fr); }

.card{
  background:#111827;
  border:1px solid #1f2937;
  border-radius:12px;
  overflow:hidden;
}

.chart{
  height:520px;
}

@media(max-width:1200px){
  .grid-6, .grid-9{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:700px){
  .grid-4, .grid-6, .grid-9{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<h1>CRYPTO TERMINAL V5 🚀</h1>

<div class="topbar">
  <button onclick="setLayout(4)">4 Charts</button>
  <button onclick="setLayout(6)">6 Charts</button>
  <button onclick="setLayout(9)">9 Charts</button>
</div>

<div id="grid" class="grid"></div>

<script src="https://s3.tradingview.com/tv.js"></script>

<script>

const defaults = [
  "BTCUSDT",
  "ETHUSDT",
  "SOLUSDT",
  "XRPUSDT",
  "DOGEUSDT",
  "ADAUSDT",
  "AVAXUSDT",
  "LINKUSDT",
  "BNBUSDT"
];

let currentLayout = parseInt(localStorage.getItem("layout")) || 4;
let widgets = {};

function saveLayout(){
  localStorage.setItem("layout", currentLayout);
}

function getSymbol(index){
  return localStorage.getItem("symbol_" + index) || defaults[index];
}

function destroyWidgets(){
  Object.values(widgets).forEach(w => {
    try { if (w?.remove) w.remove(); } catch(e){}
  });
  widgets = {};
}

function createCard(index){
  return `
    <div class="card">
      <div id="chart${index}" class="chart"></div>
    </div>
  `;
}

function render(){

  destroyWidgets();

  const grid = document.getElementById("grid");
  grid.className = "grid grid-" + currentLayout;

  let html = "";

  for(let i=0;i<currentLayout;i++){
    html += createCard(i);
  }

  grid.innerHTML = html;

  setTimeout(() => {
    for(let i=0;i<currentLayout;i++){
      loadChart(i);
    }
  }, 150);

  saveLayout();
}

function loadChart(index){

  if(!window.TradingView){
    console.error("TradingView not loaded");
    return;
  }

  const symbol = getSymbol(index);

  widgets[index] = new TradingView.widget({

    autosize: true,

    symbol: "BYBIT:" + symbol + ".P",

    interval: "15",

    timezone: "Etc/UTC",

    theme: "dark",

    style: "1",

    locale: "en",

    allow_symbol_change: true,

    hide_side_toolbar: true,
    hide_top_toolbar: false,

    withdateranges: false,
    details: false,

    enable_publishing: false,
    save_image: false,

    load_last_chart: false,

    studies: [],

    disabled_features: [
      "volume_force_overlay",
      "volume_indicator",
      "header_compare",
      "header_symbol_search",
      "header_legend",
      "study_dialog_search_control",
      "show_interval_dialog_on_key_press",
      "left_toolbar"
    ],

    overrides: {

      "paneProperties.background": "#0b1220",
      "paneProperties.vertGridProperties.color": "#161b26",
      "paneProperties.horzGridProperties.color": "#161b26",

      "paneProperties.legendProperties.showVolume": false,

      "scalesProperties.textColor": "#AAA",

      "mainSeriesProperties.candleStyle.upColor": "#22c55e",
      "mainSeriesProperties.candleStyle.downColor": "#ef4444",
      "mainSeriesProperties.candleStyle.borderUpColor": "#22c55e",
      "mainSeriesProperties.candleStyle.borderDownColor": "#ef4444",
      "mainSeriesProperties.candleStyle.wickUpColor": "#22c55e",
      "mainSeriesProperties.candleStyle.wickDownColor": "#ef4444",

      "mainSeriesProperties.priceAxisProperties.log": true
    },

    container_id: "chart" + index
  });
}

function setLayout(count){
  currentLayout = count;
  render();
}

render();

</script>

</body>
</html>
