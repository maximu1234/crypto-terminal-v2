<!-- =========================================================
     FULL index.html
     CUSTOM MULTICHART DASHBOARD V1
========================================================= -->

<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Multichart Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>

<style>

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#0b1220;
    color:white;
    font-family:Arial,sans-serif;
}

body{
    display:flex;
    flex-direction:column;
}

/* =========================================================
   HEADER
========================================================= */

#header{
    height:60px;
    border-bottom:1px solid #1f2937;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    flex-shrink:0;
}

#logo{
    font-size:22px;
    font-weight:700;
}

#top-controls{
    display:flex;
    gap:10px;
    align-items:center;
}

.layout-btn{
    border:none;
    background:#1f2937;
    color:white;
    padding:8px 14px;
    border-radius:8px;
    cursor:pointer;
    font-size:13px;
}

.layout-btn.active{
    background:#2563eb;
}

#open-terminal{
    border:none;
    background:#16a34a;
    color:white;
    padding:10px 16px;
    border-radius:8px;
    cursor:pointer;
    font-weight:600;
}

/* =========================================================
   GRID
========================================================= */

#dashboard{
    flex:1;
    display:grid;
    gap:10px;
    padding:10px;
    box-sizing:border-box;
    overflow:hidden;
}

.grid-4{
    grid-template-columns:1fr 1fr;
    grid-template-rows:1fr 1fr;
}

.grid-6{
    grid-template-columns:1fr 1fr 1fr;
    grid-template-rows:1fr 1fr;
}

.grid-9{
    grid-template-columns:1fr 1fr 1fr;
    grid-template-rows:1fr 1fr 1fr;
}

/* =========================================================
   WIDGET
========================================================= */

.widget{
    background:#111827;
    border:1px solid #1f2937;
    border-radius:12px;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    position:relative;
}

.widget:hover{
    border-color:#374151;
}

/* =========================================================
   WIDGET HEADER
========================================================= */

.widget-header{
    height:42px;
    border-bottom:1px solid #1f2937;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 12px;
    flex-shrink:0;
    background:#0f172a;
}

.left-controls{
    display:flex;
    align-items:center;
    gap:8px;
}

.symbol-select{
    background:#1f2937;
    border:none;
    color:white;
    padding:5px 8px;
    border-radius:6px;
    font-size:12px;
    cursor:pointer;
}

.tf-select{
    background:#1f2937;
    border:none;
    color:white;
    padding:5px 8px;
    border-radius:6px;
    font-size:12px;
    cursor:pointer;
}

.price-info{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:12px;
}

.price{
    font-weight:700;
}

.green{
    color:#22c55e;
}

.red{
    color:#ef4444;
}

/* =========================================================
   CHART
========================================================= */

.chart{
    flex:1;
    position:relative;
}

/* =========================================================
   FOOTER
========================================================= */

#footer{
    height:28px;
    border-top:1px solid #1f2937;
    display:flex;
    align-items:center;
    padding:0 14px;
    font-size:11px;
    color:#6b7280;
    flex-shrink:0;
}

</style>

</head>

<body>

<!-- =========================================================
     HEADER
========================================================= -->

<div id="header">

<div id="logo">
Multichart
</div>

<div id="top-controls">

<button class="layout-btn active" data-layout="4">
4
</button>

<button class="layout-btn" data-layout="6">
6
</button>

<button class="layout-btn" data-layout="9">
9
</button>

<button id="open-terminal">
Open Terminal
</button>

</div>

</div>

<!-- =========================================================
     DASHBOARD
========================================================= -->

<div id="dashboard" class="grid-4"></div>

<!-- =========================================================
     FOOTER
========================================================= -->

<div id="footer">
Custom Dashboard Engine V1
</div>

<script>

/* =========================================================
   GLOBALS
========================================================= */

const dashboard =
document.getElementById("dashboard");

let currentLayout = 4;

const symbols = [

"BTCUSDT",
"ETHUSDT",
"SOLUSDT",
"XRPUSDT",
"BNBUSDT",
"ADAUSDT",
"DOGEUSDT",
"LINKUSDT",
"AVAXUSDT"

];

const timeframes = [
"1","5","15","60","240","D"
];

const widgets = [];

/* =========================================================
   CREATE WIDGET
========================================================= */

function createWidget(index){

const widget =
document.createElement("div");

widget.className = "widget";

widget.innerHTML = `

<div class="widget-header">

<div class="left-controls">

<select class="symbol-select">

${symbols.map(s=>`

<option value="${s}">
${s}
</option>

`).join("")}

</select>

<select class="tf-select">

<option value="1">1m</option>
<option value="5">5m</option>
<option value="15">15m</option>
<option value="60" selected>1h</option>
<option value="240">4h</option>
<option value="D">1D</option>

</select>

</div>

<div class="price-info">

<div class="price">
...
</div>

<div class="change">
...
</div>

</div>

</div>

<div class="chart"></div>

`;

dashboard.appendChild(widget);

const chartContainer =
widget.querySelector(".chart");

const chart =
LightweightCharts.createChart(
chartContainer,
{

layout:{
background:{ color:"#111827" },
textColor:"#9ca3af"
},

grid:{
vertLines:{ color:"#1f2937" },
horzLines:{ color:"#1f2937" }
},

rightPriceScale:{
visible:false
},

timeScale:{
visible:false
},

crosshair:{
mode:0
}

});

const series =
chart.addCandlestickSeries({

upColor:"#22c55e",
downColor:"#ef4444",
borderVisible:false,
wickUpColor:"#22c55e",
wickDownColor:"#ef4444"

});

const symbolSelect =
widget.querySelector(".symbol-select");

const tfSelect =
widget.querySelector(".tf-select");

const priceEl =
widget.querySelector(".price");

const changeEl =
widget.querySelector(".change");

/* =========================================================
   LOAD DATA
========================================================= */

async function loadData(){

const symbol =
symbolSelect.value;

const tf =
tfSelect.value;

const url =
`https://api.bybit.com/v5/market/kline?category=linear&symbol=${symbol}&interval=${tf}&limit=200`;

try{

const res =
await fetch(url);

const json =
await res.json();

const candles =
json.result.list.reverse().map(k=>({

time:Number(k[0])/1000,
open:Number(k[1]),
high:Number(k[2]),
low:Number(k[3]),
close:Number(k[4])

}));

series.setData(candles);

chart.timeScale().setVisibleLogicalRange({

from:candles.length - 90,
to:candles.length + 10

});

const last =
candles[candles.length - 1];

const first =
candles[0];

priceEl.innerText =
last.close.toFixed(2);

const change =
(
(last.close - first.close)
/
first.close
)*100;

changeEl.innerText =
change.toFixed(2) + "%";

changeEl.className =
change >= 0
? "change green"
: "change red";

}catch(err){

console.log(err);

}

}

/* =========================================================
   EVENTS
========================================================= */

symbolSelect.onchange = loadData;
tfSelect.onchange = loadData;

widget.onclick = e=>{

if(
e.target.tagName === "SELECT"
){
return;
}

window.location.href =
`coins.html?symbol=${symbolSelect.value}`;

};

/* =========================================================
   RESIZE
========================================================= */

function resize(){

chart.applyOptions({

width:
chartContainer.clientWidth,

height:
chartContainer.clientHeight

});

}

window.addEventListener(
"resize",
resize
);

resize();

loadData();

widgets.push({

widget,
chart,
series,
loadData

});

}

/* =========================================================
   RENDER DASHBOARD
========================================================= */

function renderDashboard(){

dashboard.innerHTML = "";

dashboard.className =
`grid-${currentLayout}`;

widgets.length = 0;

for(let i=0;i<currentLayout;i++){

createWidget(i);

}

}

/* =========================================================
   LAYOUT BUTTONS
========================================================= */

document
.querySelectorAll(".layout-btn")
.forEach(btn=>{

btn.onclick = ()=>{

document
.querySelectorAll(".layout-btn")
.forEach(b=>
b.classList.remove("active")
);

btn.classList.add("active");

currentLayout =
Number(btn.dataset.layout);

renderDashboard();

};

});

/* =========================================================
   OPEN TERMINAL
========================================================= */

document
.getElementById("open-terminal")
.onclick = ()=>{

window.location.href =
"coins.html";

};

/* =========================================================
   START
========================================================= */

renderDashboard();

</script>

</body>
</html>
