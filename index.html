<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Multichart Stable</title>

<style>
body{
  margin:0;
  background:#0b1220;
  color:white;
  font-family:Arial;
  height:100vh;
  display:flex;
  flex-direction:column;
}

.header{
  padding:10px;
  border-bottom:1px solid #1f2937;
}

.layout{
  display:flex;
  gap:10px;
  padding:10px;
}

button{
  background:#2563eb;
  color:white;
  border:none;
  padding:6px 12px;
  border-radius:6px;
}

#chart{
  flex:1;
}
</style>
</head>

<body>

<div class="header">Multichart (stable version)</div>

<div class="layout">
  <button onclick="set('BTCUSDT')">BTC</button>
  <button onclick="set('ETHUSDT')">ETH</button>
  <button onclick="set('SOLUSDT')">SOL</button>
  <button onclick="set('XRPUSDT')">XRP</button>
</div>

<div id="chart"></div>

<script src="https://s3.tradingview.com/tv.js"></script>

<script>

let widget;

function init(symbol){

  if(widget){
    widget.remove();
  }

  widget = new TradingView.widget({
    autosize:true,
    symbol:"BYBIT:"+symbol,
    interval:"15",
    timezone:"Etc/UTC",
    theme:"dark",
    style:"1",
    locale:"en",

    allow_symbol_change:true,

    hide_side_toolbar:true,
    hide_top_toolbar:false,

    container_id:"chart"
  });

  localStorage.setItem("symbol",symbol);
}

function set(symbol){
  init(symbol);
}

window.onload = ()=>{
  const saved = localStorage.getItem("symbol") || "BTCUSDT";
  init(saved);
};

</script>

</body>
</html>
