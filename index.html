<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Multichart - Главная</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#0b1220;
  color:#fff;
  font-family:Arial;
  height:100vh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.header{
  display:flex;
  justify-content:space-between;
  padding:10px 14px;
  border-bottom:1px solid #1f2937;
}

.header-left{font-size:18px;font-weight:700}

.header-menu{display:flex;gap:14px}

.header-menu a{
  color:#9ca3af;
  text-decoration:none;
  padding:6px 10px;
  border-radius:6px;
  font-weight:600;
}

.header-menu a.active{background:#1f2937;color:#fff}

.layout-bar{
  display:flex;
  gap:10px;
  padding:10px 14px;
  border-bottom:1px solid #1f2937;
}

.layout-bar button{
  background:#2563eb;
  border:none;
  color:#fff;
  padding:6px 12px;
  border-radius:6px;
  cursor:pointer;
  font-weight:600;
}

#grid{
  flex:1;
  display:grid;
  gap:10px;
  padding:10px;
}

.card{
  background:#111827;
  border:1px solid #1f2937;
  border-radius:12px;
  overflow:hidden;
  display:flex;
}

.chart{width:100%;height:100%}
</style>
</head>

<body>

<div class="header">
  <div class="header-left">Multichart</div>

  <div class="header-menu">
    <a href="index.html" class="active">Главная</a>
    <a href="coins.html">Монеты</a>
  </div>
</div>

<div class="layout-bar">
  <button onclick="setLayout(4)">4</button>
  <button onclick="setLayout(6)">6</button>
  <button onclick="setLayout(9)">9</button>
</div>

<div id="grid"></div>

<script src="https://s3.tradingview.com/tv.js"></script>

<script>

const defaults=["BTCUSDT","ETHUSDT","SOLUSDT","XRPUSDT","DOGEUSDT","ADAUSDT","AVAXUSDT","LINKUSDT","BNBUSDT"];

let currentLayout=parseInt(localStorage.getItem("layout"))||4;
let widgets={};

function getSymbol(i){
  return localStorage.getItem("symbol_"+i)||defaults[i];
}

function saveSymbol(i,s){
  localStorage.setItem("symbol_"+i,s);
}

function destroy(){
  Object.values(widgets).forEach(w=>w?.remove?.());
  widgets={};
}

function grid(n){
  const c=Math.ceil(Math.sqrt(n));
  return{cols:c,rows:Math.ceil(n/c)};
}

function render(){

  const gridEl=document.getElementById("grid");

  destroy();
  gridEl.innerHTML="";

  const {cols,rows}=grid(currentLayout);

  gridEl.style.gridTemplateColumns=`repeat(${cols},1fr)`;
  gridEl.style.gridTemplateRows=`repeat(${rows},1fr)`;

  for(let i=0;i<currentLayout;i++){
    const card=document.createElement("div");
    card.className="card";

    const div=document.createElement("div");
    div.className="chart";
    div.id="chart"+i;

    card.appendChild(div);
    gridEl.appendChild(card);
  }

  setTimeout(()=>{
    for(let i=0;i<currentLayout;i++) load(i);
  },200);
}

function load(i){

  const symbol=getSymbol(i);

  const widget=new TradingView.widget({
    autosize:true,
    symbol:"BYBIT:"+symbol,
    interval:"15",
    timezone:"Etc/UTC",
    theme:"dark",
    style:"1",
    locale:"en",
    allow_symbol_change:true,

    disabled_features:[
      "volume_force_overlay",
      "create_volume_indicator_by_default",
      "header_compare",
      "header_symbol_search",
      "left_toolbar"
    ],

    studies_overrides:{
      "volume.volume.color.0":"rgba(0,0,0,0)",
      "volume.volume.color.1":"rgba(0,0,0,0)",
      "volume.volume.transparency":100
    },

    overrides:{
      "paneProperties.priceAxisProperties.log":true
    },

    container_id:"chart"+i
  });

  widgets[i]=widget;

  widget.onChartReady(()=>{
    widget.onAutoSaveNeeded(()=>{
      try{
        const sym=widget.activeChart().symbol?.()||"";
        const clean=sym.split(":")[1]||sym;
        saveSymbol(i,clean);
      }catch(e){}
    });
  });
}

function setLayout(n){
  currentLayout=n;
  localStorage.setItem("layout",n);
  render();
}

render();

</script>

</body>
</html>
