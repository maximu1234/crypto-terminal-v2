
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Crypto Terminal</title>
  <style>
    body {
      margin: 0;
      background: #0b1220;
      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 12px;
      overflow: hidden;
    }

    .toolbar {
      padding: 10px;
      border-bottom: 1px solid #1f2937;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .toolbar input,
    .toolbar select {
      background: #0b1220;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      margin-right: 8px;
    }

    .chart {
      height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #6b7280;
    }

    .live {
      color: #22c55e;
      font-size: 12px;
      font-weight: bold;
    }
  </style>
</head>
<body>

<h1>CRYPTO TERMINAL WORKS 🚀</h1>

<div class="grid">
  <div class="card">
    <div class="toolbar">
      <div>
        <input value="BTCUSDT"/>
        <select>
          <option>1m</option>
          <option>5m</option>
          <option>15m</option>
          <option>1h</option>
        </select>
      </div>
      <div class="live">LIVE</div>
    </div>
    <div class="chart">Chart Placeholder</div>
  </div>

  <div class="card">
    <div class="toolbar">
      <div>
        <input value="ETHUSDT"/>
        <select>
          <option>1m</option>
          <option>5m</option>
          <option>15m</option>
          <option>1h</option>
        </select>
      </div>
      <div class="live">LIVE</div>
    </div>
    <div class="chart">Chart Placeholder</div>
  </div>

  <div class="card">
    <div class="toolbar">
      <div>
        <input value="SOLUSDT"/>
        <select>
          <option>1m</option>
          <option>5m</option>
          <option>15m</option>
          <option>1h</option>
        </select>
      </div>
      <div class="live">LIVE</div>
    </div>
    <div class="chart">Chart Placeholder</div>
  </div>
</div>

</body>
</html>
