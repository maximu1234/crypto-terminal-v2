<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Multichart Fix</title>

<style>
body{
  margin:0;
  background:#0b1220;
  color:white;
  font-family:Arial,sans-serif;
  height:100vh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.header{
  display:flex;
  gap:10px;
  padding:10px;
  border-bottom:1px solid #1f2937;
  align-items:center;
}

button{
  padding:6px 12px;
  background:#2563eb;
  border:none;
  color:white;
  border-radius:6px;
  cursor:pointer;
}

#chart{
  flex:1;
}
</style>
</head>

<body>

<div class="header">
  <button onclick="setSymbol('BTCUSDT')">BTC</button>
  <button onclick="setSymbol('ETHUSDT')">ETH</button>
  <button onclick="setSymbol('SOLUSDT')">SOL</button>
  <button onclick="setSymbol('XRPUSDT')">XRP</button>
</div>

<div id="chart"></div>

<script src="https://s3.tradingview.com/tv.js"></script>

<script>

let widget;
let currentSymbol = localStorage.getItem("symbol") || "BTCUSDT";

function create(symbol){

  if(widget){
    widget.remove();
  }

  widget = new TradingView.widget({
    autosize: true,
    symbol: "BYBIT:" + symbol,
    interval: "15",
    timezone: "Etc/UTC",
    theme: "dark",
    style: "1",
    locale: "en",

    allow_symbol_change: true,
    hide_side_toolbar: true,
    hide_top_toolbar: false,

    disabled_features: [
      "volume_force_overlay",
      "create_volume_indicator_by_default",
      "header_compare",
      "header_symbol_search",
      "left_toolbar"
    ],

    container_id: "chart"
  });

  localStorage.setItem("symbol", symbol);

  widget.onChartReady(() => {

    const chart = widget.activeChart();

    function forceLog(){
      try{
        chart.setPriceScale("logarithmic");
      } catch(e){}
    }

    // первый запуск
    forceLog();

    // TradingView часто сбрасывает scale после загрузки данных
    chart.onDataLoaded().subscribe(null, forceLog);
    chart.onVisibleRangeChanged().subscribe(null, forceLog);

    // страховка от BYBIT reset
    setInterval(forceLog, 1200);
  });
}

function setSymbol(sym){
  currentSymbol = sym;
  create(sym);
}

window.onload = () => {
  create(currentSymbol);
};

</script>

</body>
</html>
