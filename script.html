</div>

<div id="header-controls" class="screener-header-desktop script-header-controls">

<div class="screener-header-toolbar">

<div class="screener-header-pick-wrap">
<button
type="button"
class="screener-header-pick"
id="script-desktop-layout-trigger"
aria-haspopup="listbox"
aria-expanded="false"
>
<span id="script-desktop-layout-label">9</span>
<span class="screener-header-pick-caret" aria-hidden="true">▾</span>
</button>
<div class="screener-header-pick-menu hidden" id="script-desktop-layout-menu" role="listbox" aria-label="Количество виджетов">
<button type="button" class="screener-header-pick-item" data-layout="4">4 виджета</button>
<button type="button" class="screener-header-pick-item" data-layout="6">6 виджетов</button>
<button type="button" class="screener-header-pick-item active" data-layout="9">9 виджетов</button>
</div>
</div>

<span class="screener-release-marker" data-release-marker aria-label="Версия"></span>

</div>

</div>

</header>

<div id="script-toolbar" class="script-toolbar" aria-label="Настройки скрипта">

<div class="script-toolbar-row script-toolbar-row--settings">

<label class="script-toolbar-field">
<span>Глубина поиска</span>
<select id="script-search-depth" aria-label="Глубина поиска">
<option value="10">10 баров</option>
<option value="30" selected>30 баров</option>
<option value="50">50 баров</option>
<option value="100">100 баров</option>
<option value="300">300 баров</option>
</select>
</label>

<label class="script-toolbar-field">
<span>Направление</span>
<select id="script-side-filter" aria-label="Направление сканирования">
<option value="both" selected>Long + Short</option>
<option value="long">Long</option>
<option value="short">Short</option>
</select>
</label>

<label class="script-toolbar-field script-toolbar-field--turnover" title="Минимальный 24h оборот (USDT). Ниже — сетап не показывается.">
<span>Объем за сутки от</span>
<input type="text" id="script-min-turnover" class="script-turnover-input" inputmode="numeric" autocomplete="off" value="20.000.000" aria-label="Минимальный объём за сутки" />
<span class="script-turnover-unit">USDT</span>
</label>

<label class="script-toolbar-field">
<span>Проверять ТФ</span>
<select id="script-auto-tf">
<option value="1">1m</option>
<option value="5">5m</option>
<option value="15" selected>15m</option>
<option value="60">1h</option>
<option value="240">4h</option>
<option value="D">1D</option>
<option value="W">W</option>
</select>
</label>

<label class="script-toolbar-field">
<span>Раз в</span>
<select id="script-auto-period">
<option value="15m">15 мин</option>
<option value="1h" selected>1 час</option>
<option value="6h">6 часов</option>
<option value="24h">24 часа</option>
</select>
</label>

<button type="button" class="script-auto-btn" id="script-auto-start">Запустить</button>
<button type="button" class="script-auto-btn" id="script-auto-stop" disabled>Остановить</button>

<div class="script-toolbar-status">
<div id="script-scan-progress" class="script-scan-progress hidden" aria-live="polite"></div>
<div class="script-auto-status" id="script-auto-status">Авто-сканирование выключено</div>
</div>

</div>

</div>

<main id="script-grid" class="grid-9" aria-live="polite"></main>

<footer id="pagination" aria-label="Страницы"></footer>

<div id="script-status" class="hidden">Загрузка…</div>

<script type="module" src="/js/script-page-boot.js?v=18"></script>

</body>
</html>
