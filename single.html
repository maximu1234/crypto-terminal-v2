<script>

let widget;
let lastSymbol = localStorage.getItem("symbol") || "BTCUSDT";

function create(symbol){

  if(widget){
    widget.remove();
  }

  widget = new TradingView.widget({

    autosize:true,
    symbol:"BYBIT:" + symbol,
    interval:"15",
    timezone:"Etc/UTC",
    theme:"dark",
    style:"1",
    locale:"en",

    allow_symbol_change:true,

    hide_side_toolbar:true,
    hide_top_toolbar:false,

    overrides:{
      "mainSeriesProperties.priceAxisProperties.log": true
    },

    studies:[],
    disabled_features:[
      "volume_force_overlay",
      "create_volume_indicator_by_default",
      "volume_indicator",
      "header_compare",
      "header_symbol_search",
      "left_toolbar"
    ],

    container_id:"chart"
  });

  localStorage.setItem("symbol", symbol);

  widget.onChartReady(() => {

    const container = document.getElementById("chart");

    const observer = new MutationObserver(() => {

      // TradingView всегда пишет символ в header как текст
      const el = container.querySelector(".js-symbol-header");

      if(!el) return;

      const text = el.innerText || "";
      const clean = text.split(":")[1] || text;

      if(clean && clean !== lastSymbol){
        lastSymbol = clean;
        localStorage.setItem("symbol", clean);
      }

    });

    observer.observe(container, {
      subtree: true,
      childList: true,
      characterData: true
    });

  });
}

function setSymbol(sym){
  lastSymbol = sym;
  create(sym);
}

window.onload = () => {
  create(lastSymbol);
};

</script>
