<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Terminal V2.2 FIX</title>

<style>
body{
  margin:0;
  background:#0b1220;
  color:white;
  font-family:Arial;
  overflow:hidden;
}

#app{
  display:grid;
  grid-template-columns: 1fr 240px;
  height:100vh;
}

#left{
  display:flex;
  flex-direction:column;
  height:100%;
}

#chart{
  flex:1;
  min-height:0;
}

#list{
  border-left:1px solid #1f2937;
  overflow:auto;
}

.coin{
  padding:10px;
  border-bottom:1px solid #1f2937;
  cursor:pointer;
}

.active{
  background:#1e293b;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>

</head>

<body>

<div id="app">

  <div id="left">
    <div id="chart"></div>
  </div>

  <div id="list"></div>

</div>

<script>

const symbols = ["BTCUSDT","ETHUSDT","SOLUSDT"];

let index = 0;

let chart;
let series;

let candles = [];
let loading = false;

/* ---------------- INIT ---------------- */

function initChart(){

  const el = document.getElementById("chart");

  chart = LightweightCharts.createChart(el, {
    layout:{
      background:{ color:"#0b1220" },
      textColor:"#d1d5db"
    },
    grid:{
      vertLines:{ color:"#161b26" },
      horzLines:{ color:"#161b26" }
    },
    timeScale:{
      borderColor:"#1f2937",
      timeVisible:true
    }
  });

  series = chart.addCandlestickSeries();

  chart.timeScale().subscribeVisibleLogicalRangeChange(range => {
    if(!range || loading) return;

    if(range.from < 50){
      loadMore();
    }
  });

  window.addEventListener("resize", () => {
    chart.applyOptions({
      width: el.clientWidth,
      height: el.clientHeight
    });
  });
}

/* ---------------- HISTORY ---------------- */

async function loadHistory(symbol){

  const res = await fetch(
    `https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=15m&limit=1500`
  );

  const data = await res.json();

  candles = data.map(d => ({
    time: d[0] / 1000,
    open: +d[1],
    high: +d[2],
    low: +d[3],
    close: +d[4]
  }));

  series.setData(candles);

  requestAnimationFrame(() => {
    chart.timeScale().fitContent();
  });
}

/* ---------------- LOAD MORE ---------------- */

async function loadMore(){

  loading = true;

  const symbol = symbols[index];
  const oldest = candles[0];

  const res = await fetch(
    `https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=15m&limit=1500&endTime=${oldest.time*1000}`
  );

  const data = await res.json();

  const older = data.map(d => ({
    time: d[0] / 1000,
    open: +d[1],
    high: +d[2],
    low: +d[3],
    close: +d[4]
  }));

  if(older.length > 0){

    candles = [...older, ...candles];

    series.setData(candles);

    requestAnimationFrame(() => {
      chart.timeScale().fitContent();
    });
  }

  loading = false;
}

/* ---------------- LIST ---------------- */

function renderList(){

  const list = document.getElementById("list");
  list.innerHTML = "";

  symbols.forEach((s,i)=>{

    const div = document.createElement("div");
    div.className = "coin" + (i===index ? " active" : "");
    div.innerText = s;

    div.onclick = async () => {
      index = i;
      await loadHistory(s);
      renderList();
    };

    list.appendChild(div);

  });

}

/* ---------------- START ---------------- */

initChart();
renderList();
loadHistory(symbols[0]);

</script>

</body>
</html>
