<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Multichart Terminal V1.4</title>

<style>
body{
  margin:0;
  background:#0b1220;
  color:white;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

#app{
  display:grid;
  grid-template-columns: 1fr 240px;
  height:100vh;
}

/* LEFT */
#left{
  display:flex;
  flex-direction:column;
  height:100%;
}

/* TOP BAR (TIMEFRAMES) */
#topbar{
  display:flex;
  gap:6px;
  padding:8px;
  border-bottom:1px solid #1f2937;
  background:#0b1220;
}

.tf-btn{
  background:#1f2937;
  color:#fff;
  border:none;
  padding:6px 10px;
  border-radius:6px;
  cursor:pointer;
  font-weight:600;
  font-size:12px;
}

.tf-btn.active{
  background:#2563eb;
}

/* CHART */
#chart{
  flex:1;
  width:100%;
  min-height:0;
}

/* RSI placeholder */
#rsi{
  height:160px;
  border-top:1px solid #1f2937;
  background:#0f172a;
}

/* LIST */
#list{
  border-left:1px solid #1f2937;
  overflow:auto;
}

.coin{
  padding:10px;
  border-bottom:1px solid #1f2937;
  cursor:pointer;
}

.coin:hover{
  background:#111827;
}

.active{
  background:#1e293b;
}

.header{
  position:absolute;
  top:10px;
  left:10px;
  font-size:12px;
  color:#9ca3af;
  z-index:10;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>

</head>

<body>

<div class="header">
  Multichart Terminal V1.4 (TIMEFRAMES TEST)
</div>

<div id="app">

  <div id="left">

    <!-- TIMEFRAMES -->
    <div id="topbar">
      <button class="tf-btn active" data-tf="5m">5m</button>
      <button class="tf-btn" data-tf="15m">15m</button>
      <button class="tf-btn" data-tf="1h">1h</button>
      <button class="tf-btn" data-tf="4h">4h</button>
      <button class="tf-btn" data-tf="1d">1D</button>
    </div>

    <div id="chart"></div>
    <div id="rsi"></div>

  </div>

  <div id="list"></div>

</div>

<script>

const symbols = [
  "BTCUSDT","ETHUSDT","SOLUSDT","XRPUSDT",
  "DOGEUSDT","ADAUSDT","AVAXUSDT","LINKUSDT","BNBUSDT"
];

let index = 0;
let tf = "15m";

let chart;
let candleSeries;

/* ---------------- MAP TF TO BINANCE ---------------- */

function mapTF(t){
  if(t==="1d") return "1d";
  if(t==="4h") return "4h";
  if(t==="1h") return "1h";
  if(t==="15m") return "15m";
  if(t==="5m") return "5m";
  return "15m";
}

/* ---------------- FETCH ---------------- */

async function fetchCandles(symbol){

  const interval = mapTF(tf);

  const res = await fetch(
    `https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${interval}&limit=500`
  );

  const data = await res.json();

  return data.map(d => ({
    time: d[0] / 1000,
    open: +d[1],
    high: +d[2],
    low: +d[3],
    close: +d[4]
  }));
}

/* ---------------- INIT ---------------- */

function initChart(){

  const container = document.getElementById("chart");

  chart = LightweightCharts.createChart(container, {
    layout: {
      background: { color: "#0b1220" },
      textColor: "#d1d5db"
    },
    grid: {
      vertLines: { color: "#161b26" },
      horzLines: { color: "#161b26" }
    },
    rightPriceScale: {
      borderColor: "#1f2937"
    },
    timeScale: {
      borderColor: "#1f2937",
      timeVisible: true,
      secondsVisible: false
    }
  });

  candleSeries = chart.addCandlestickSeries();

  const resize = () => {
    chart.applyOptions({
      width: container.clientWidth,
      height: container.clientHeight
    });
  };

  window.addEventListener("resize", resize);
  resize();
}

/* ---------------- LOAD ---------------- */

async function loadSymbol(symbol){

  const candles = await fetchCandles(symbol);

  candleSeries.setData(candles);

  requestAnimationFrame(() => {
    chart.timeScale().fitContent();
  });

}

/* ---------------- LIST ---------------- */

function renderList(){

  const list = document.getElementById("list");
  list.innerHTML = "";

  symbols.forEach((s,i)=>{

    const div = document.createElement("div");
    div.className = "coin" + (i===index ? " active" : "");
    div.innerText = s;

    div.onclick = () => {
      index = i;
      update();
    };

    list.appendChild(div);

  });

}

/* ---------------- UPDATE ---------------- */

async function update(){
  renderList();
  await loadSymbol(symbols[index]);
}

/* ---------------- TIMEFRAME UI ---------------- */

function initTF(){

  document.querySelectorAll(".tf-btn").forEach(btn=>{
    btn.onclick = async () => {

      document.querySelectorAll(".tf-btn")
        .forEach(b=>b.classList.remove("active"));

      btn.classList.add("active");

      tf = btn.dataset.tf;

      await update();
    };
  });

}

/* ---------------- KEYBOARD ---------------- */

document.addEventListener("keydown",(e)=>{

  if(e.key==="ArrowDown"){
    index = Math.min(symbols.length-1,index+1);
    update();
  }

  if(e.key==="ArrowUp"){
    index = Math.max(0,index-1);
    update();
  }

});

/* ---------------- START ---------------- */

initChart();
initTF();
renderList();
update();

</script>

</body>
</html>
