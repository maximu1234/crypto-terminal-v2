<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Terminal FIX V2</title>

<style>
body{
  margin:0;
  background:#0b1220;
  color:white;
  font-family:Arial;
  overflow:hidden;
}

#app{
  display:grid;
  grid-template-columns: 1fr 220px;
  height:100vh;
}

#chart{
  height:100%;
}

#list{
  border-left:1px solid #1f2937;
  overflow:auto;
}

.coin{
  padding:10px;
  border-bottom:1px solid #1f2937;
  cursor:pointer;
}

.active{
  background:#1e293b;
}
</style>

<!-- ⚠️ IMPORTANT FIX -->
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>

</head>

<body>

<div id="app">

  <div id="chart"></div>

  <div id="list"></div>

</div>

<script>

const symbols=[
  "BTCUSDT","ETHUSDT","SOLUSDT","XRPUSDT",
  "DOGEUSDT","ADAUSDT"
];

let index=0;

let chart;
let series;

async function fetchCandles(symbol){

  const res = await fetch(
    `https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=15m&limit=100`
  );

  const data = await res.json();

  return data.map(d=>({
    time:d[0]/1000,
    open:+d[1],
    high:+d[2],
    low:+d[3],
    close:+d[4]
  }));

}

function init(){

  if(!window.LightweightCharts){
    alert("LightweightCharts failed to load");
    return;
  }

  chart = LightweightCharts.createChart(
    document.getElementById("chart"),
    {
      layout:{
        background:{ color:"#0b1220" },
        textColor:"#d1d5db"
      },
      grid:{
        vertLines:{ color:"#161b26" },
        horzLines:{ color:"#161b26" }
      }
    }
  );

  series = chart.addCandlestickSeries();

}

async function load(sym){

  const candles = await fetchCandles(sym);

  series.setData(candles);

}

function renderList(){

  const list=document.getElementById("list");
  list.innerHTML="";

  symbols.forEach((s,i)=>{

    const div=document.createElement("div");
    div.className="coin"+(i===index?" active":"");
    div.innerText=s;

    div.onclick=()=>{
      index=i;
      update();
    };

    list.appendChild(div);

  });

}

async function update(){
  renderList();
  await load(symbols[index]);
}

init();
renderList();
update();

</script>

</body>
</html>
