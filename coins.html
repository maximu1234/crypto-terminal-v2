<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Multichart</title>

<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/terminal.css">

<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>

</head>

<body>

<div id="app">

<div id="left">

<div id="header">

<div id="logo">
Multichart
</div>

<div class="menu">
<a href="index.html">Главная</a>
<a href="coins.html" class="active">Монеты</a>
</div>

</div>

<div id="topbar">

<div id="current-symbol">
BTCUSDT.P
</div>

<button class="tf-btn" data-tf="1">1m</button>
<button class="tf-btn" data-tf="5">5m</button>
<button class="tf-btn active" data-tf="60">1h</button>
<button class="tf-btn" data-tf="15">15m</button>
<button class="tf-btn" data-tf="240">4h</button>
<button class="tf-btn" data-tf="D">1D</button>

</div>

<div id="chart-wrap">
<div id="chart"></div>
</div>

<div id="rsi-wrap">
<div id="rsi-band"></div>
<div id="rsi-chart"></div>
</div>

</div>

<div id="list">

<div id="filter-wrap">

<select id="market-filter">

<option value="crypto">
Crypto
</option>

<option value="new">
New
</option>

<option value="stocks">
Stocks
</option>

<option value="commodities">
Commodities
</option>

<option value="forex">
Forex
</option>

</select>

</div>

<div id="table-header">

<div class="sortable" data-sort="favorites">
★
</div>

<div class="sortable" data-sort="symbol">
Coin
</div>

<div class="sortable" data-sort="24h">
24h
</div>

<div class="sortable" data-sort="1h">
1h
</div>

</div>

<div id="coins-body"></div>

</div>

</div>

<script src="js/terminal.js" type="module"></script>

</body>
</html>
