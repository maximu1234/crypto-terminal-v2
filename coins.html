<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Multichart Terminal V1.5</title>

<style>
body{
  margin:0;
  background:#0b1220;
  color:white;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

#app{
  display:grid;
  grid-template-columns: 1fr 240px;
  height:100vh;
}

#left{
  display:flex;
  flex-direction:column;
  height:100%;
}

#topbar{
  display:flex;
  gap:6px;
  padding:8px;
  border-bottom:1px solid #1f2937;
}

.tf-btn{
  background:#1f2937;
  border:none;
  color:white;
  padding:6px 10px;
  border-radius:6px;
  cursor:pointer;
}

.tf-btn.active{
  background:#2563eb;
}

#chart{
  flex:1;
}

#rsi{
  height:160px;
  border-top:1px solid #1f2937;
  background:#0f172a;
}

#list{
  border-left:1px solid #1f2937;
  overflow:auto;
}

.coin{
  padding:10px;
  border-bottom:1px solid #1f2937;
  cursor:pointer;
}

.active{
  background:#1e293b;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>

</head>

<body>

<div id="app">

  <div id="left">

    <div id="topbar">
      <button class="tf-btn active" data="5m">5m</button>
      <button class="tf-btn" data="15m">15m</button>
      <button class="tf-btn" data="1h">1h</button>
      <button class="tf-btn" data="4h">4h</button>
      <button class="tf-btn" data="1d">1D</button>
    </div>

    <div id="chart"></div>
    <div id="rsi"></div>

  </div>

  <div id="list"></div>

</div>

<script>

const symbols = [
  "BTCUSDT","ETHUSDT","SOLUSDT","XRPUSDT",
  "DOGEUSDT","ADAUSDT","AVAXUSDT","LINKUSDT","BNBUSDT"
];

let index = 0;
let tf = "15m";

let chart;
let candleSeries;

/* ---------------- DATA (HUGE FIX) ---------------- */

async function fetchCandles(symbol){

  const res = await fetch(
    `https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${tf}&limit=1500`
  );

  const data = await res.json();

  return data.map(d => ({
    time: d[0] / 1000,
    open: +d[1],
    high: +d[2],
    low: +d[3],
    close: +d[4]
  }));
}

/* ---------------- INIT ---------------- */

function initChart(){

  const container = document.getElementById("chart");

  chart = LightweightCharts.createChart(container, {
    layout:{
      background:{ color:"#0b1220" },
      textColor:"#d1d5db"
    },
    grid:{
      vertLines:{ color:"#161b26" },
      horzLines:{ color:"#161b26" }
    },
    timeScale:{
      borderColor:"#1f2937",
      timeVisible:true
    },
    rightPriceScale:{
      borderColor:"#1f2937"
    }
  });

  candleSeries = chart.addCandlestickSeries();

  const resize = () => {
    chart.applyOptions({
      width: container.clientWidth,
      height: container.clientHeight
    });
  };

  window.addEventListener("resize", resize);
  resize();
}

/* ---------------- LOAD ---------------- */

async function loadSymbol(symbol){

  const candles = await fetchCandles(symbol);

  candleSeries.setData(candles);

  // ❌ NO fitContent (this was hiding the real problem)

  const from = Math.max(0, candles.length - 400);
  const to = candles.length;

  chart.timeScale().setVisibleLogicalRange({ from, to });

}

/* ---------------- LIST ---------------- */

function renderList(){

  const list = document.getElementById("list");
  list.innerHTML = "";

  symbols.forEach((s,i)=>{

    const div = document.createElement("div");
    div.className = "coin" + (i===index ? " active" : "");
    div.innerText = s;

    div.onclick = () => {
      index = i;
      update();
    };

    list.appendChild(div);

  });

}

/* ---------------- UPDATE ---------------- */

async function update(){
  renderList();
  await loadSymbol(symbols[index]);
}

/* ---------------- TF ---------------- */

function initTF(){

  document.querySelectorAll(".tf-btn").forEach(btn=>{
    btn.onclick = () => {

      document.querySelectorAll(".tf-btn")
        .forEach(b=>b.classList.remove("active"));

      btn.classList.add("active");

      tf = btn.getAttribute("data");

      update();
    };
  });

}

/* ---------------- START ---------------- */

initChart();
initTF();
renderList();
update();

</script>

</body>
</html>
