<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Multichart</title>

<style>

html,body{
  margin:0;
  height:100%;
  background:#0b1220;
  overflow:hidden;
  font-family:Arial,sans-serif;
  color:white;
}

/* =========================
   APP
========================= */

#app{
  display:grid;
  grid-template-columns:1fr 320px;
  height:100vh;
}

/* =========================
   LEFT
========================= */

#left{
  display:flex;
  flex-direction:column;
  min-height:0;
}

/* =========================
   HEADER
========================= */

#header{
  height:56px;
  border-bottom:1px solid #1f2937;
  display:flex;
  align-items:center;
  padding:0 18px;
  gap:28px;
  flex-shrink:0;
  background:#0b1220;
}

#logo{
  font-size:20px;
  font-weight:700;
  color:white;
}

.menu{
  display:flex;
  gap:18px;
}

.menu a{
  color:#9ca3af;
  text-decoration:none;
  font-size:14px;
  transition:0.2s;
}

.menu a:hover{
  color:white;
}

.menu a.active{
  color:white;
}

/* =========================
   TOPBAR
========================= */

#topbar{
  display:flex;
  align-items:center;
  gap:6px;
  padding:8px 12px;
  border-bottom:1px solid #1f2937;
  flex-shrink:0;
}

#current-symbol{
  font-size:14px;
  font-weight:700;
  color:white;
  margin-right:12px;
  padding-right:14px;
  border-right:1px solid #1f2937;
  min-width:120px;
}

.tf-btn{
  background:#1f2937;
  color:white;
  border:none;
  border-radius:6px;
  padding:6px 10px;
  cursor:pointer;
  font-size:12px;
}

.tf-btn.active{
  background:#2563eb;
}

/* =========================
   CHART
========================= */

#chart-wrap{
  height:82%;
  min-height:0;
}

#chart{
  width:100%;
  height:100%;
}

/* =========================
   RSI
========================= */

#rsi-wrap{
  position:relative;
  height:18%;
  min-height:90px;
  border-top:1px solid #1f2937;
}

#rsi-band{
  position:absolute;
  left:0;
  right:0;
  top:30%;
  height:40%;
  background:#1e1e31;
  pointer-events:none;
  z-index:0;
}

#rsi-chart{
  position:absolute;
  inset:0;
  z-index:1;
}

/* =========================
   RIGHT TABLE
========================= */

#list{
  border-left:1px solid #1f2937;
  overflow:auto;
  background:#0b1220;
  display:flex;
  flex-direction:column;
}

/* HEADER */

#table-header{
  display:grid;
  grid-template-columns:28px 1fr 70px 70px;
  padding:10px 12px;
  border-bottom:1px solid #1f2937;
  position:sticky;
  top:0;
  background:#0f172a;
  z-index:10;
  font-size:12px;
  color:#9ca3af;
}

.sortable{
  cursor:pointer;
  user-select:none;
}

.sortable:hover{
  color:white;
}

/* ROW */

.coin{
  display:grid;
  grid-template-columns:28px 1fr 70px 70px;
  align-items:center;
  padding:10px 12px;
  border-bottom:1px solid #1f2937;
  cursor:pointer;
  user-select:none;
  font-size:13px;
}

.coin:hover{
  background:#111827;
}

.coin.active{
  background:#1e293b;
}

/* CELLS */

.col-flag{
  display:flex;
  align-items:center;
  justify-content:center;
}

.flag{
  width:10px;
  height:10px;
  border-radius:50%;
  cursor:pointer;
  transition:0.2s;
  border:1px solid #374151;
  background:transparent;
}

.favorite{
  background:#ef4444 !important;
  border-color:#ef4444;
  box-shadow:0 0 8px #ef4444;
}

.col-symbol{
  font-weight:600;
}

.col-change{
  text-align:right;
  font-size:12px;
}

.green{
  color:#22c55e;
}

.red{
  color:#ef4444;
}

</style>

<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>

</head>

<body>

<div id="app">

  <!-- LEFT -->
  <div id="left">

    <!-- HEADER -->
    <div id="header">

      <div id="logo">
        Multichart
      </div>

      <div class="menu">
        <a href="index.html">Главная</a>
        <a href="coins.html" class="active">Монеты</a>
      </div>

    </div>

    <!-- TOPBAR -->
    <div id="topbar">

      <div id="current-symbol">
        BTCUSDT.P
      </div>

      <button class="tf-btn active" data-tf="1m">1m</button>
      <button class="tf-btn" data-tf="5m">5m</button>
      <button class="tf-btn" data-tf="15m">15m</button>
      <button class="tf-btn" data-tf="1h">1h</button>
      <button class="tf-btn" data-tf="4h">4h</button>
      <button class="tf-btn" data-tf="1d">1D</button>

    </div>

    <!-- CHART -->
    <div id="chart-wrap">
      <div id="chart"></div>
    </div>

    <!-- RSI -->
    <div id="rsi-wrap">
      <div id="rsi-band"></div>
      <div id="rsi-chart"></div>
    </div>

  </div>

  <!-- RIGHT -->
  <div id="list">

    <div id="table-header">

      <div class="col-flag sortable" data-sort="favorites">
        ★
      </div>

      <div class="col-symbol sortable" data-sort="symbol">
        Coin
      </div>

      <div class="col-change sortable" data-sort="24h">
        24h
      </div>

      <div class="col-change sortable" data-sort="1h">
        1h
      </div>

    </div>

    <div id="coins-body"></div>

  </div>

</div>

<script>

/* =========================
   CONFIG
========================= */

const symbols = [
  "BTCUSDT",
  "ETHUSDT",
  "SOLUSDT",
  "XRPUSDT",
  "DOGEUSDT",
  "ADAUSDT",
  "AVAXUSDT",
  "LINKUSDT"
];

let currentTF = "15m";

let currentSymbol = "BTCUSDT";

const HISTORY_LIMIT = 1500;

let sortMode = "symbol";
let sortAsc = true;

let favorites =
  JSON.parse(localStorage.getItem("favorites") || "[]");

/* =========================
   STATE
========================= */

let candles = [];
let oldestTime = null;
let loadingHistory = false;

/* =========================
   MARKET DATA
========================= */

let marketData = [];

function generateMarketData(){

  marketData = symbols.map(symbol => {

    return {

      symbol,

      change24:
        ((Math.random() * 12) - 6),

      change1h:
        ((Math.random() * 4) - 2)

    };

  });

}

/* =========================
   MAIN CHART
========================= */

const chart = LightweightCharts.createChart(
  document.getElementById("chart"),
  {
    layout:{
      background:{ color:"#0b1220" },
      textColor:"#d1d5db"
    },

    grid:{
      vertLines:{ color:"#161b26" },
      horzLines:{ color:"#161b26" }
    },

    crosshair:{
      mode: LightweightCharts.CrosshairMode.Normal
    },

    rightPriceScale:{
      borderColor:"#1f2937",
      mode:1
    },

    timeScale:{
      borderColor:"#1f2937",
      timeVisible:true
    }
  }
);

const candleSeries = chart.addCandlestickSeries({
  upColor:"#22c55e",
  downColor:"#ef4444",
  borderVisible:false,
  wickUpColor:"#22c55e",
  wickDownColor:"#ef4444"
});

/* =========================
   RSI
========================= */

const rsiChart = LightweightCharts.createChart(
  document.getElementById("rsi-chart"),
  {
    layout:{
      background:{ color:"transparent" },
      textColor:"#797b85"
    },

    grid:{
      vertLines:{ color:"#161b26" },
      horzLines:{ color:"#161b26" }
    },

    crosshair:{
      mode: LightweightCharts.CrosshairMode.Normal
    },

    rightPriceScale:{
      borderColor:"#1f2937"
    },

    timeScale:{
      visible:false
    }
  }
);

const rsiSeries = rsiChart.addLineSeries({
  color:"#a39cb9",
  lineWidth:2
});

[30,50,70].forEach(level => {

  rsiSeries.createPriceLine({
    price:level,
    color:"#797b85",
    lineStyle:LightweightCharts.LineStyle.Dashed,
    lineWidth:1,
    axisLabelVisible:true
  });

});

/* =========================
   RSI CALC
========================= */

function calculateRSI(data, period = 14){

  if(data.length < period + 1){
    return [];
  }

  let gains = 0;
  let losses = 0;

  const result = [];

  for(let i=1;i<=period;i++){

    const diff = data[i].close - data[i-1].close;

    if(diff >= 0){
      gains += diff;
    }else{
      losses += Math.abs(diff);
    }
  }

  let avgGain = gains / period;
  let avgLoss = losses / period;

  let rs = avgGain / (avgLoss || 1);

  let rsi = 100 - (100 / (1 + rs));

  result.push({
    time:data[period].time,
    value:rsi
  });

  for(let i=period+1;i<data.length;i++){

    const diff = data[i].close - data[i-1].close;

    let gain = 0;
    let loss = 0;

    if(diff >= 0){
      gain = diff;
    }else{
      loss = Math.abs(diff);
    }

    avgGain = ((avgGain * (period - 1)) + gain) / period;
    avgLoss = ((avgLoss * (period - 1)) + loss) / period;

    rs = avgGain / (avgLoss || 1);

    rsi = 100 - (100 / (1 + rs));

    result.push({
      time:data[i].time,
      value:rsi
    });
  }

  return result;
}

/* =========================
   LOAD SYMBOL
========================= */

async function loadSymbol(symbol){

  currentSymbol = symbol;

  loadingHistory = false;

  document.getElementById(
    "current-symbol"
  ).innerText = symbol + ".P";

  const url =
    `https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${currentTF}&limit=${HISTORY_LIMIT}`;

  const res = await fetch(url);

  const raw = await res.json();

  candles = raw.map(k => ({
    time:k[0] / 1000,
    open:+k[1],
    high:+k[2],
    low:+k[3],
    close:+k[4]
  }));

  oldestTime = candles[0].time;

  candleSeries.setData(candles);

  const rsiData = calculateRSI(candles);

  rsiSeries.setData(rsiData);

  chart.timeScale().fitContent();

  renderList();
}

/* =========================
   LOAD MORE HISTORY
========================= */

async function loadMoreHistory(){

  if(loadingHistory) return;

  loadingHistory = true;

  const endTime = (oldestTime * 1000) - 1;

  const url =
    `https://api.binance.com/api/v3/klines?symbol=${currentSymbol}&interval=${currentTF}&limit=${HISTORY_LIMIT}&endTime=${endTime}`;

  const res = await fetch(url);

  const raw = await res.json();

  if(!raw.length){
    loadingHistory = false;
    return;
  }

  const older = raw.map(k => ({
    time:k[0] / 1000,
    open:+k[1],
    high:+k[2],
    low:+k[3],
    close:+k[4]
  }));

  oldestTime = older[0].time;

  candles = [...older, ...candles];

  candleSeries.setData(candles);

  const rsiData = calculateRSI(candles);

  rsiSeries.setData(rsiData);

  loadingHistory = false;
}

/* =========================
   HISTORY
========================= */

chart.timeScale().subscribeVisibleLogicalRangeChange(range => {

  if(!range) return;

  if(range.from < 100){
    loadMoreHistory();
  }

});

chart.timeScale().subscribeVisibleLogicalRangeChange(range => {

  if(range){
    rsiChart.timeScale().setVisibleLogicalRange(range);
  }

});

/* =========================
   RESIZE
========================= */

function resizeCharts(){

  const chartWrap = document.getElementById("chart-wrap");
  const rsiWrap = document.getElementById("rsi-chart");

  chart.applyOptions({
    width:chartWrap.clientWidth,
    height:chartWrap.clientHeight
  });

  rsiChart.applyOptions({
    width:rsiWrap.clientWidth,
    height:rsiWrap.clientHeight
  });
}

window.addEventListener("resize", resizeCharts);

/* =========================
   TF BUTTONS
========================= */

document.querySelectorAll(".tf-btn").forEach(btn => {

  btn.onclick = async () => {

    document.querySelectorAll(".tf-btn")
      .forEach(b => b.classList.remove("active"));

    btn.classList.add("active");

    currentTF = btn.dataset.tf;

    await loadSymbol(currentSymbol);
  };

});

/* =========================
   TABLE
========================= */

function renderList(){

  const list = document.getElementById("coins-body");

  list.innerHTML = "";

  let data = [...marketData];

  /* SORT */

  data.sort((a,b)=>{

    let result = 0;

    if(sortMode === "favorites"){

      const af =
        favorites.includes(a.symbol) ? 1 : 0;

      const bf =
        favorites.includes(b.symbol) ? 1 : 0;

      result = af - bf;

    }

    else if(sortMode === "symbol"){

      result =
        a.symbol.localeCompare(b.symbol);

    }

    else if(sortMode === "24h"){

      result =
        a.change24 - b.change24;

    }

    else if(sortMode === "1h"){

      result =
        a.change1h - b.change1h;

    }

    return sortAsc ? result : -result;

  });

  /* RENDER */

  data.forEach(item => {

    const div = document.createElement("div");

    div.className = "coin";

    if(currentSymbol === item.symbol){
      div.classList.add("active");
    }

    const isFavorite =
      favorites.includes(item.symbol);

    div.innerHTML = `

      <div class="col-flag">

        <div
          class="flag
          ${isFavorite ? 'favorite' : ''}"
          data-fav="${item.symbol}"
        ></div>

      </div>

      <div class="col-symbol">
        ${item.symbol}
      </div>

      <div class="col-change ${item.change24 >= 0 ? 'green' : 'red'}">
        ${item.change24.toFixed(2)}%
      </div>

      <div class="col-change ${item.change1h >= 0 ? 'green' : 'red'}">
        ${item.change1h.toFixed(2)}%
      </div>

    `;

    /* OPEN COIN */

    div.onclick = async (e) => {

      if(e.target.dataset.fav){
        return;
      }

      await loadSymbol(item.symbol);

    };

    /* FAVORITE */

    const favBtn =
      div.querySelector("[data-fav]");

    favBtn.onclick = (e) => {

      e.stopPropagation();

      if(favorites.includes(item.symbol)){

        favorites =
          favorites.filter(
            s => s !== item.symbol
          );

      }else{

        favorites.push(item.symbol);

      }

      localStorage.setItem(
        "favorites",
        JSON.stringify(favorites)
      );

      renderList();
    };

    list.appendChild(div);

  });

}

/* =========================
   SORTING
========================= */

document.querySelectorAll(".sortable")
  .forEach(el => {

    el.onclick = () => {

      const mode = el.dataset.sort;

      if(sortMode === mode){

        sortAsc = !sortAsc;

      }else{

        sortMode = mode;
        sortAsc = false;

      }

      renderList();

    };

  });

/* =========================
   KEYBOARD NAV
========================= */

window.addEventListener("keydown", async e => {

  let sorted = [...marketData];

  sorted.sort((a,b)=>{

    let result = 0;

    if(sortMode === "favorites"){

      const af =
        favorites.includes(a.symbol) ? 1 : 0;

      const bf =
        favorites.includes(b.symbol) ? 1 : 0;

      result = af - bf;

    }

    else if(sortMode === "symbol"){

      result =
        a.symbol.localeCompare(b.symbol);

    }

    else if(sortMode === "24h"){

      result =
        a.change24 - b.change24;

    }

    else if(sortMode === "1h"){

      result =
        a.change1h - b.change1h;

    }

    return sortAsc ? result : -result;

  });

  let currentPos =
    sorted.findIndex(
      s => s.symbol === currentSymbol
    );

  if(e.code === "ArrowDown" || e.code === "Space"){

    e.preventDefault();

    currentPos++;

    if(currentPos >= sorted.length){
      currentPos = 0;
    }

    await loadSymbol(
      sorted[currentPos].symbol
    );
  }

  if(e.code === "ArrowUp"){

    e.preventDefault();

    currentPos--;

    if(currentPos < 0){
      currentPos = sorted.length - 1;
    }

    await loadSymbol(
      sorted[currentPos].symbol
    );
  }

});

/* =========================
   START
========================= */

generateMarketData();

resizeCharts();

renderList();

loadSymbol("BTCUSDT");

</script>

</body>
</html>
