<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Multichart Terminal V2</title>

<style>
body{
  margin:0;
  background:#0b1220;
  color:white;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

#app{
  display:grid;
  grid-template-columns: 1fr 240px;
  height:100vh;
}

#left{
  display:flex;
  flex-direction:column;
  height:100%;
}

#topbar{
  display:flex;
  gap:6px;
  padding:8px;
  border-bottom:1px solid #1f2937;
}

.tf-btn{
  background:#1f2937;
  border:none;
  color:white;
  padding:6px 10px;
  border-radius:6px;
  cursor:pointer;
}

.tf-btn.active{
  background:#2563eb;
}

#chart{
  flex:1;
}

#list{
  border-left:1px solid #1f2937;
  overflow:auto;
}

.coin{
  padding:10px;
  border-bottom:1px solid #1f2937;
  cursor:pointer;
}

.active{
  background:#1e293b;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>

</head>

<body>

<div id="app">

  <div id="left">

    <div id="topbar">
      <button class="tf-btn active" data="1m">1m</button>
      <button class="tf-btn" data="5m">5m</button>
      <button class="tf-btn" data="15m">15m</button>
      <button class="tf-btn" data="1h">1h</button>
    </div>

    <div id="chart"></div>

  </div>

  <div id="list"></div>

</div>

<script>

const symbols = ["BTCUSDT","ETHUSDT","SOLUSDT"];

let symbolIndex = 0;
let tf = "1m";

let chart;
let series;

let candles = [];
let ws = null;

/* ---------------- INIT CHART ---------------- */

function initChart(){

  const container = document.getElementById("chart");

  chart = LightweightCharts.createChart(container, {
    layout:{
      background:{ color:"#0b1220" },
      textColor:"#d1d5db"
    },
    grid:{
      vertLines:{ color:"#161b26" },
      horzLines:{ color:"#161b26" }
    },
    timeScale:{
      borderColor:"#1f2937",
      timeVisible:true
    }
  });

  series = chart.addCandlestickSeries();

  const resize = () => {
    chart.applyOptions({
      width: container.clientWidth,
      height: container.clientHeight
    });
  };

  window.addEventListener("resize", resize);
  resize();
}

/* ---------------- HISTORY ENGINE ---------------- */

async function loadHistory(symbol){

  const res = await fetch(
    `https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${tf}&limit=3000`
  );

  const data = await res.json();

  candles = data.map(d => ({
    time: d[0] / 1000,
    open: +d[1],
    high: +d[2],
    low: +d[3],
    close: +d[4]
  }));

  series.setData(candles);

  chart.timeScale().fitContent();
}

/* ---------------- LIVE ENGINE (WS) ---------------- */

function connectWS(symbol){

  if(ws){
    ws.close();
  }

  const stream = `${symbol.toLowerCase()}@kline_${tf}`;

  ws = new WebSocket(`wss://stream.binance.com:9443/ws/${stream}`);

  ws.onmessage = (event) => {

    const msg = JSON.parse(event.data);
    const k = msg.k;

    const candle = {
      time: k.t / 1000,
      open: +k.o,
      high: +k.h,
      low: +k.l,
      close: +k.c
    };

    const last = candles[candles.length - 1];

    if(last && last.time === candle.time){
      candles[candles.length - 1] = candle;
      series.update(candle);
    } else {
      candles.push(candle);
      series.update(candle);
    }
  };
}

/* ---------------- SWITCH SYMBOL ---------------- */

async function update(){

  const symbol = symbols[symbolIndex];

  await loadHistory(symbol);
  connectWS(symbol);

  renderList();
}

/* ---------------- LIST ---------------- */

function renderList(){

  const list = document.getElementById("list");
  list.innerHTML = "";

  symbols.forEach((s,i)=>{

    const div = document.createElement("div");
    div.className = "coin" + (i===symbolIndex ? " active" : "");
    div.innerText = s;

    div.onclick = () => {
      symbolIndex = i;
      update();
    };

    list.appendChild(div);

  });

}

/* ---------------- TF ---------------- */

document.querySelectorAll(".tf-btn").forEach(btn=>{

  btn.onclick = () => {

    document.querySelectorAll(".tf-btn")
      .forEach(b=>b.classList.remove("active"));

    btn.classList.add("active");

    tf = btn.dataset.data || btn.getAttribute("data");

    update();
  };

});

/* ---------------- START ---------------- */

initChart();
renderList();
update();

</script>

</body>
</html>
