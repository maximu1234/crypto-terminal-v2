<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Terminal V4.4 RSI BAND FIX</title>

<style>
html,body{
  margin:0;
  height:100%;
  background:#0b1220;
  font-family:Arial;
  overflow:hidden;
  color:white;
}

#app{
  display:grid;
  grid-template-columns: 1fr 240px;
  height:100vh;
}

#left{
  display:flex;
  flex-direction:column;
  height:100vh;
  overflow:hidden;
}

#topbar{
  display:flex;
  gap:6px;
  padding:8px;
  border-bottom:1px solid #1f2937;
  flex-shrink:0;
}

.tf-btn{
  background:#1f2937;
  color:white;
  border:none;
  padding:6px 10px;
  border-radius:6px;
  cursor:pointer;
  font-size:12px;
}

.tf-btn.active{
  background:#2563eb;
}

#chart{
  height:70%;
}

#rsi{
  height:30%;
  position:relative;
  border-top:1px solid #1f2937;
}

/* 🔥 RSI BAND (ONLY 30-70 AREA) */
#rsi-band{
  position:absolute;
  left:0;
  right:0;
  top:30%;
  height:40%;
  background:#1e1e31;
  z-index:0;
  pointer-events:none;
}

#rsi-chart{
  position:absolute;
  inset:0;
  z-index:1;
}

#list{
  border-left:1px solid #1f2937;
  overflow:auto;
}

.coin{
  padding:10px;
  border-bottom:1px solid #1f2937;
  cursor:pointer;
}

.coin:hover{
  background:#111827;
}

.active{
  background:#1e293b;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>

</head>

<body>

<div id="app">

  <div id="left">

    <div id="topbar">
      <button class="tf-btn active" data="1m">1m</button>
      <button class="tf-btn" data="5m">5m</button>
      <button class="tf-btn" data="15m">15m</button>
      <button class="tf-btn" data="1h">1h</button>
      <button class="tf-btn" data="4h">4h</button>
      <button class="tf-btn" data="1d">1D</button>
    </div>

    <div id="chart"></div>

    <div id="rsi">
      <div id="rsi-band"></div>
      <div id="rsi-chart"></div>
    </div>

  </div>

  <div id="list"></div>

</div>

<script>

const symbols = ["BTCUSDT","ETHUSDT","SOLUSDT","XRPUSDT","DOGEUSDT"];

let index = 0;
let tf = "15m";

let chart;
let series;

let rsiChart;
let rsiSeries;

let candles = [];
let rsiValues = [];

let oldestLoadedTime = null;
let loading = false;

/* ---------------- RSI ---------------- */

function calculateRSI(data, period = 14){

  let gains = 0;
  let losses = 0;
  let rsi = [];

  for(let i = 1; i < data.length; i++){

    const diff = data[i].close - data[i-1].close;

    if(diff >= 0) gains += diff;
    else losses += Math.abs(diff);

    if(i >= period){

      const avgGain = gains / period;
      const avgLoss = losses / period;

      const rs = avgGain / (avgLoss || 1);
      const value = 100 - (100 / (1 + rs));

      rsi.push({
        time: data[i].time,
        value
      });

      const oldDiff = data[i - period + 1].close - data[i - period].close;

      if(oldDiff >= 0) gains -= oldDiff;
      else losses -= Math.abs(oldDiff);
    }
  }

  return rsi;
}

/* ---------------- INIT ---------------- */

function init(){

  const chartEl = document.getElementById("chart");
  const rsiEl = document.getElementById("rsi-chart");

  chart = LightweightCharts.createChart(chartEl, {
    layout:{
      background:{ color:"#0b1220" },
      textColor:"#d1d5db"
    },
    grid:{
      vertLines:{ color:"#161b26" },
      horzLines:{ color:"#161b26" }
    },
    timeScale:{
      borderColor:"#1f2937",
      timeVisible:true
    },
    crosshair:{
      mode: LightweightCharts.CrosshairMode.Normal
    }
  });

  series = chart.addCandlestickSeries();

  rsiChart = LightweightCharts.createChart(rsiEl, {
    layout:{
      background:{ color:"transparent" }
    },
    grid:{
      vertLines:{ color:"#161b26" },
      horzLines:{ color:"#161b26" }
    },
    rightPriceScale:{
      scaleMargins:{
        top:0.1,
        bottom:0.1
      },
      minValue:0,
      maxValue:100
    },
    timeScale:{
      borderColor:"#1f2937"
    }
  });

  rsiSeries = rsiChart.addLineSeries({
    color:"#a39cb9",
    lineWidth:2
  });

  drawLevels();

  sync();

  window.addEventListener("resize", () => {
    chart.applyOptions({
      width: chartEl.clientWidth,
      height: chartEl.clientHeight
    });

    rsiChart.applyOptions({
      width: rsiEl.clientWidth,
      height: rsiEl.clientHeight
    });
  });

  initTF();
  renderList();
  load(symbols[0]);
}

/* ---------------- RSI LEVEL LINES ---------------- */

function drawLevels(){

  [30,50,70].forEach(level=>{
    rsiSeries.createPriceLine({
      price: level,
      color:"#797b85",
      lineWidth:1,
      lineStyle: LightweightCharts.LineStyle.Dashed,
      axisLabelVisible:true
    });
  });

}

/* ---------------- SYNC ---------------- */

function sync(){

  chart.timeScale().subscribeVisibleLogicalRangeChange(range => {
    if(range) rsiChart.timeScale().setVisibleLogicalRange(range);
  });

}

/* ---------------- LOAD ---------------- */

async function load(symbol){

  index = symbols.indexOf(symbol);

  const res = await fetch(
    `https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${tf}&limit=1500`
  );

  const data = await res.json();

  candles = data.map(d => ({
    time: d[0] / 1000,
    open: +d[1],
    high: +d[2],
    low: +d[3],
    close: +d[4]
  }));

  oldestLoadedTime = candles[0].time;

  series.setData(candles);

  rsiValues = calculateRSI(candles);
  rsiSeries.setData(rsiValues);

  chart.timeScale().fitContent();
}

/* ---------------- LOAD MORE ---------------- */

async function loadMore(){

  loading = true;

  const symbol = symbols[index];

  const res = await fetch(
    `https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${tf}&limit=1500&endTime=${oldestLoadedTime*1000 - 1}`
  );

  const data = await res.json();

  if(!data.length){
    loading = false;
    return;
  }

  const older = data.map(d => ({
    time: d[0] / 1000,
    open: +d[1],
    high: +d[2],
    low: +d[3],
    close: +d[4]
  }));

  oldestLoadedTime = older[0].time;

  candles = [...older, ...candles];

  series.setData(candles);

  rsiValues = calculateRSI(candles);
  rsiSeries.setData(rsiValues);

  loading = false;
}

/* ---------------- TF ---------------- */

function initTF(){

  document.querySelectorAll(".tf-btn").forEach(btn=>{
    btn.onclick = () => {

      document.querySelectorAll(".tf-btn")
        .forEach(b=>b.classList.remove("active"));

      btn.classList.add("active");

      tf = btn.dataset.data || btn.getAttribute("data");

      load(symbols[index]);
    };
  });
}

/* ---------------- LIST ---------------- */

function renderList(){

  const list = document.getElementById("list");
  list.innerHTML = "";

  symbols.forEach((s,i)=>{

    const div = document.createElement("div");
    div.className = "coin" + (i===index ? " active" : "");
    div.innerText = s;

    div.onclick = () => {
      load(s);
      renderList();
    };

    list.appendChild(div);

  });

}

/* ---------------- START ---------------- */

init();

</script>

</body>
</html>
