<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Multichart</title>

<style>

html,body{
  margin:0;
  height:100%;
  overflow:hidden;
  background:#0b1220;
  font-family:Arial,sans-serif;
  color:white;
}

#app{
  display:grid;
  grid-template-columns:1fr 360px;
  height:100vh;
}

/* =========================
   LEFT
========================= */

#left{
  display:flex;
  flex-direction:column;
  min-height:0;
}

/* =========================
   HEADER
========================= */

#header{
  height:56px;
  border-bottom:1px solid #1f2937;
  display:flex;
  align-items:center;
  padding:0 18px;
  gap:28px;
  flex-shrink:0;
}

#logo{
  font-size:20px;
  font-weight:700;
}

.menu{
  display:flex;
  gap:18px;
}

.menu a{
  color:#9ca3af;
  text-decoration:none;
  font-size:14px;
}

.menu a.active{
  color:white;
}

/* =========================
   TOPBAR
========================= */

#topbar{
  height:46px;
  display:flex;
  align-items:center;
  gap:6px;
  padding:0 12px;
  border-bottom:1px solid #1f2937;
  flex-shrink:0;
}

#current-symbol{
  font-size:14px;
  font-weight:700;
  margin-right:12px;
  padding-right:14px;
  border-right:1px solid #1f2937;
  min-width:140px;
}

.tf-btn{
  border:none;
  background:#1f2937;
  color:white;
  padding:6px 10px;
  border-radius:6px;
  cursor:pointer;
  font-size:12px;
}

.tf-btn.active{
  background:#2563eb;
}

/* =========================
   CHART
========================= */

#chart-wrap{
  height:82%;
  min-height:0;
  padding-right:28px;
  box-sizing:border-box;
}

#chart{
  width:100%;
  height:100%;
}

/* =========================
   RSI
========================= */

#rsi-wrap{
  position:relative;
  height:18%;
  min-height:90px;
  border-top:1px solid #1f2937;
  padding-right:28px;
  box-sizing:border-box;
}

#rsi-band{
  position:absolute;
  left:0;
  right:28px;
  top:30%;
  height:40%;
  background:#1e1e31;
  pointer-events:none;
  z-index:0;
}

#rsi-chart{
  position:absolute;
  inset:0;
  right:28px;
  z-index:1;
}

/* =========================
   RIGHT
========================= */

#list{
  border-left:1px solid #1f2937;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* =========================
   FILTER
========================= */

#filter-wrap{
  padding:10px;
  border-bottom:1px solid #1f2937;
  background:#0f172a;
}

#market-filter{
  width:100%;
  background:#111827;
  color:white;
  border:1px solid #374151;
  border-radius:8px;
  padding:8px 10px;
  font-size:13px;
}

/* =========================
   TABLE
========================= */

#table-header{
  display:grid;
  grid-template-columns:28px 1fr 70px 70px;
  padding:10px 12px;
  border-bottom:1px solid #1f2937;
  font-size:12px;
  color:#9ca3af;
  background:#0f172a;
}

.sortable{
  cursor:pointer;
}

#coins-body{
  overflow:auto;
  flex:1;
}

.coin{
  display:grid;
  grid-template-columns:28px 1fr 70px 70px;
  align-items:center;
  padding:10px 12px;
  border-bottom:1px solid #1f2937;
  font-size:13px;
  cursor:pointer;
}

.coin:hover{
  background:#111827;
}

.coin.active{
  background:#1e293b;
}

.col-flag{
  display:flex;
  justify-content:center;
}

.flag{
  width:10px;
  height:10px;
  border-radius:50%;
  border:1px solid #4b5563;
  background:transparent;
}

.favorite{
  background:#ef4444 !important;
  border-color:#ef4444;
  box-shadow:0 0 8px #ef4444;
}

.green{
  color:#22c55e;
}

.red{
  color:#ef4444;
}

.col-change{
  text-align:right;
}

</style>

<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>

</head>

<body>

<div id="app">

  <!-- LEFT -->
  <div id="left">

    <div id="header">

      <div id="logo">
        Multichart
      </div>

      <div class="menu">
        <a href="index.html">Главная</a>
        <a href="coins.html" class="active">Монеты</a>
      </div>

    </div>

    <div id="topbar">

      <div id="current-symbol">
        BTCUSDT.P
      </div>

      <button class="tf-btn" data-tf="1">1m</button>
      <button class="tf-btn" data-tf="5">5m</button>
      <button class="tf-btn" data-tf="15">15m</button>
      <button class="tf-btn" data-tf="60">1h</button>
      <button class="tf-btn active" data-tf="240">4h</button>
      <button class="tf-btn" data-tf="D">1D</button>

    </div>

    <div id="chart-wrap">
      <div id="chart"></div>
    </div>

    <div id="rsi-wrap">
      <div id="rsi-band"></div>
      <div id="rsi-chart"></div>
    </div>

  </div>

  <!-- RIGHT -->
  <div id="list">

    <div id="filter-wrap">

      <select id="market-filter">

        <option value="crypto">
          Crypto
        </option>

        <option value="new">
          New
        </option>

        <option value="stocks">
          Stocks
        </option>

        <option value="commodities">
          Commodities
        </option>

      </select>

    </div>

    <div id="table-header">

      <div class="sortable" data-sort="favorites">
        ★
      </div>

      <div class="sortable" data-sort="symbol">
        Coin
      </div>

      <div class="sortable" data-sort="24h">
        24h
      </div>

      <div class="sortable" data-sort="1h">
        1h
      </div>

    </div>

    <div id="coins-body"></div>

  </div>

</div>

<script>

/* =========================
   GLOBALS
========================= */

let currentDataset = "crypto";
let currentTF = "240";
let currentSymbol = "BTCUSDT";

let sortMode = "symbol";
let sortAsc = true;

let favorites =
  JSON.parse(localStorage.getItem("favorites") || "[]");

let marketData = [];

let candles = [];
let oldestTime = null;
let loadingHistory = false;

const HISTORY_LIMIT = 1000;

let allBybitSymbols = [];
let newListings = [];

/* =========================
   STATIC LISTS
========================= */

const stockSymbols = [

"AAPL","TSLA","NVDA","MSFT","AMZN",
"META","GOOGL","NFLX","AMD","COIN",
"PLTR","INTC","BA","UBER","PYPL",
"DIS","BABA","NIO","SHOP","SNAP"

];

const commoditySymbols = [

"GOLD","SILVER","OIL","NATGAS",
"COPPER","WHEAT","CORN","COCOA",
"COFFEE","SOYBEAN"

];

/* =========================
   LOAD BYBIT SYMBOLS
========================= */

async function loadBybitSymbols(){

  const res = await fetch(
    "https://api.bybit.com/v5/market/instruments-info?category=linear&limit=1000"
  );

  const json = await res.json();

  const list = json.result.list;

  allBybitSymbols = list
    .filter(x => x.status === "Trading")
    .map(x => x.symbol);

  const weekAgo =
    Date.now() - (7 * 24 * 60 * 60 * 1000);

  newListings = list
    .filter(x => {

      if(!x.launchTime) return false;

      return Number(x.launchTime) > weekAgo;

    })
    .map(x => x.symbol);

}

/* =========================
   GET SYMBOLS
========================= */

function getCurrentSymbols(){

  if(currentDataset === "crypto"){
    return allBybitSymbols;
  }

  if(currentDataset === "new"){
    return newListings;
  }

  if(currentDataset === "stocks"){
    return stockSymbols;
  }

  return commoditySymbols;
}

/* =========================
   MARKET DATA
========================= */

function generateMarketData(){

  marketData = getCurrentSymbols().map(symbol => {

    return {

      symbol,

      change24:
        ((Math.random()*20)-10),

      change1h:
        ((Math.random()*6)-3)

    };

  });

}

/* =========================
   MAIN CHART
========================= */

const chart =
  LightweightCharts.createChart(
    document.getElementById("chart"),
{
  layout:{
    background:{ color:"#0b1220" },
    textColor:"#d1d5db"
  },

  grid:{
    vertLines:{ color:"#161b26" },
    horzLines:{ color:"#161b26" }
  },

  rightPriceScale:{
    borderColor:"#1f2937",
    mode:1
  },

  timeScale:{
    borderColor:"#1f2937",
    timeVisible:true,
    rightOffset:24
  },

  crosshair:{
    mode:0
  }

});

const candleSeries =
  chart.addCandlestickSeries({

    upColor:"#22c55e",
    downColor:"#ef4444",
    borderVisible:false,
    wickUpColor:"#22c55e",
    wickDownColor:"#ef4444"

});

/* =========================
   RSI CHART
========================= */

const rsiChart =
  LightweightCharts.createChart(
    document.getElementById("rsi-chart"),
{
  layout:{
    background:{ color:"transparent" },
    textColor:"#797b85"
  },

  grid:{
    vertLines:{ color:"#161b26" },
    horzLines:{ color:"#161b26" }
  },

  rightPriceScale:{
    borderColor:"#1f2937"
  },

  timeScale:{
    visible:false
  },

  crosshair:{
    mode:0
  }

});

const rsiSeries =
  rsiChart.addLineSeries({

    color:"#a39cb9",
    lineWidth:2

});

[30,50,70].forEach(level=>{

  rsiSeries.createPriceLine({

    price:level,
    color:"#797b85",
    lineStyle:
      LightweightCharts.LineStyle.Dashed,
    lineWidth:1,
    axisLabelVisible:true

  });

});

/* =========================
   RSI
========================= */

function calculateRSI(data, period=14){

  if(data.length < period+1){
    return [];
  }

  let gains = 0;
  let losses = 0;

  const result = [];

  for(let i=1;i<=period;i++){

    const diff =
      data[i].close - data[i-1].close;

    if(diff >= 0){
      gains += diff;
    }else{
      losses += Math.abs(diff);
    }
  }

  let avgGain = gains / period;
  let avgLoss = losses / period;

  for(let i=period;i<data.length;i++){

    const diff =
      data[i].close - data[i-1].close;

    const gain =
      diff > 0 ? diff : 0;

    const loss =
      diff < 0 ? Math.abs(diff) : 0;

    avgGain =
      ((avgGain*(period-1))+gain)/period;

    avgLoss =
      ((avgLoss*(period-1))+loss)/period;

    const rs =
      avgGain / (avgLoss || 1);

    const rsi =
      100 - (100/(1+rs));

    result.push({

      time:data[i].time,
      value:rsi

    });
  }

  return result;
}

/* =========================
   LOAD SYMBOL
========================= */

async function loadSymbol(symbol){

  currentSymbol = symbol;

  loadingHistory = false;

  document.getElementById(
    "current-symbol"
  ).innerText =
    currentDataset === "crypto" ||
    currentDataset === "new"
      ? symbol + ".P"
      : symbol;

  /* =========================
     BYBIT CRYPTO / NEW
  ========================= */

  if(
    currentDataset === "crypto" ||
    currentDataset === "new"
  ){

    const url =
      `https://api.bybit.com/v5/market/kline?category=linear&symbol=${symbol}&interval=${currentTF}&limit=${HISTORY_LIMIT}`;

    const res = await fetch(url);

    const json = await res.json();

    const raw =
      json.result.list.reverse();

    candles = raw.map(k=>({

      time:Number(k[0])/1000,
      open:Number(k[1]),
      high:Number(k[2]),
      low:Number(k[3]),
      close:Number(k[4])

    }));

    oldestTime = candles[0].time;
  }

  /* =========================
     DEMO STOCKS
  ========================= */

  else{

    candles = [];

    let price = 100;

    for(let i=0;i<15000;i++){

      const open = price;

      const close =
        open + ((Math.random()-0.5)*5);

      const high =
        Math.max(open,close) + Math.random()*2;

      const low =
        Math.min(open,close) - Math.random()*2;

      candles.push({

        time:
          Math.floor(Date.now()/1000)
          - ((15000-i)*3600),

        open,
        high,
        low,
        close

      });

      price = close;
    }

    oldestTime = candles[0].time;
  }

  candleSeries.setData(candles);

  rsiSeries.setData(
    calculateRSI(candles)
  );

  chart.timeScale().fitContent();

  renderList();
}

/* =========================
   LOAD HISTORY
========================= */

async function loadMoreHistory(){

  if(
    currentDataset !== "crypto" &&
    currentDataset !== "new"
  ){
    return;
  }

  if(loadingHistory) return;

  loadingHistory = true;

  const endTime =
    (oldestTime * 1000) - 1;

  const url =
    `https://api.bybit.com/v5/market/kline?category=linear&symbol=${currentSymbol}&interval=${currentTF}&limit=${HISTORY_LIMIT}&end=${endTime}`;

  const res = await fetch(url);

  const json = await res.json();

  const raw =
    json.result.list.reverse();

  if(!raw.length){

    loadingHistory = false;
    return;
  }

  const older = raw.map(k=>({

    time:Number(k[0])/1000,
    open:Number(k[1]),
    high:Number(k[2]),
    low:Number(k[3]),
    close:Number(k[4])

  }));

  oldestTime = older[0].time;

  candles = [...older,...candles];

  candleSeries.setData(candles);

  rsiSeries.setData(
    calculateRSI(candles)
  );

  loadingHistory = false;
}

/* =========================
   HISTORY ENGINE
========================= */

chart.timeScale()
.subscribeVisibleLogicalRangeChange(range=>{

  if(!range) return;

  if(range.from < 300){

    loadMoreHistory();
  }

});

chart.timeScale()
.subscribeVisibleLogicalRangeChange(range=>{

  if(range){

    rsiChart.timeScale()
      .setVisibleLogicalRange(range);
  }

});

/* =========================
   RESIZE
========================= */

function resizeCharts(){

  chart.applyOptions({

    width:
      document.getElementById(
        "chart-wrap"
      ).clientWidth,

    height:
      document.getElementById(
        "chart-wrap"
      ).clientHeight

  });

  rsiChart.applyOptions({

    width:
      document.getElementById(
        "rsi-chart"
      ).clientWidth,

    height:
      document.getElementById(
        "rsi-chart"
      ).clientHeight

  });
}

window.addEventListener(
  "resize",
  resizeCharts
);

/* =========================
   TF
========================= */

document
.querySelectorAll(".tf-btn")
.forEach(btn=>{

  btn.onclick = async ()=>{

    document
    .querySelectorAll(".tf-btn")
    .forEach(b=>
      b.classList.remove("active")
    );

    btn.classList.add("active");

    currentTF = btn.dataset.tf;

    await loadSymbol(currentSymbol);
  };

});

/* =========================
   FILTER
========================= */

document
.getElementById("market-filter")
.addEventListener("change", async e=>{

  currentDataset = e.target.value;

  generateMarketData();

  currentSymbol =
    getCurrentSymbols()[0];

  renderList();

  await loadSymbol(currentSymbol);

});

/* =========================
   TABLE
========================= */

function renderList(){

  const list =
    document.getElementById(
      "coins-body"
    );

  list.innerHTML = "";

  let data = [...marketData];

  data.sort((a,b)=>{

    let result = 0;

    if(sortMode === "favorites"){

      const af =
        favorites.includes(a.symbol)
          ? 1 : 0;

      const bf =
        favorites.includes(b.symbol)
          ? 1 : 0;

      result = af - bf;
    }

    else if(sortMode === "symbol"){

      result =
        a.symbol.localeCompare(
          b.symbol
        );
    }

    else if(sortMode === "24h"){

      result =
        a.change24 - b.change24;
    }

    else if(sortMode === "1h"){

      result =
        a.change1h - b.change1h;
    }

    return sortAsc
      ? result
      : -result;

  });

  data.forEach(item=>{

    const div =
      document.createElement("div");

    div.className = "coin";

    if(currentSymbol === item.symbol){
      div.classList.add("active");
    }

    const isFavorite =
      favorites.includes(item.symbol);

    div.innerHTML = `

      <div class="col-flag">

        <div
          class="flag
          ${isFavorite ? 'favorite' : ''}"
          data-fav="${item.symbol}"
        ></div>

      </div>

      <div>
        ${item.symbol}
      </div>

      <div class="col-change
        ${item.change24>=0
          ? 'green'
          : 'red'}">

        ${item.change24.toFixed(2)}%

      </div>

      <div class="col-change
        ${item.change1h>=0
          ? 'green'
          : 'red'}">

        ${item.change1h.toFixed(2)}%

      </div>

    `;

    div.onclick = async e=>{

      if(e.target.dataset.fav){
        return;
      }

      await loadSymbol(item.symbol);
    };

    const favBtn =
      div.querySelector("[data-fav]");

    favBtn.onclick = e=>{

      e.stopPropagation();

      if(
        favorites.includes(item.symbol)
      ){

        favorites =
          favorites.filter(
            s => s !== item.symbol
          );

      }else{

        favorites.push(item.symbol);
      }

      localStorage.setItem(
        "favorites",
        JSON.stringify(favorites)
      );

      renderList();
    };

    list.appendChild(div);

  });

}

/* =========================
   SORT
========================= */

document
.querySelectorAll(".sortable")
.forEach(el=>{

  el.onclick = ()=>{

    const mode =
      el.dataset.sort;

    if(sortMode === mode){

      sortAsc = !sortAsc;

    }else{

      sortMode = mode;
      sortAsc = false;
    }

    renderList();
  };

});

/* =========================
   KEYBOARD
========================= */

window.addEventListener(
  "keydown",
  async e=>{

    let sorted = [...marketData];

    sorted.sort((a,b)=>{

      let result = 0;

      if(sortMode === "favorites"){

        const af =
          favorites.includes(a.symbol)
            ? 1 : 0;

        const bf =
          favorites.includes(b.symbol)
            ? 1 : 0;

        result = af - bf;
      }

      else if(sortMode === "symbol"){

        result =
          a.symbol.localeCompare(
            b.symbol
          );
      }

      else if(sortMode === "24h"){

        result =
          a.change24 - b.change24;
      }

      else if(sortMode === "1h"){

        result =
          a.change1h - b.change1h;
      }

      return sortAsc
        ? result
        : -result;

    });

    let currentPos =
      sorted.findIndex(
        s => s.symbol === currentSymbol
      );

    if(
      e.code === "ArrowDown" ||
      e.code === "Space"
    ){

      e.preventDefault();

      currentPos++;

      if(currentPos >= sorted.length){
        currentPos = 0;
      }

      await loadSymbol(
        sorted[currentPos].symbol
      );
    }

    if(e.code === "ArrowUp"){

      e.preventDefault();

      currentPos--;

      if(currentPos < 0){
        currentPos =
          sorted.length - 1;
      }

      await loadSymbol(
        sorted[currentPos].symbol
      );
    }

});

/* =========================
   START
========================= */

async function init(){

  await loadBybitSymbols();

  generateMarketData();

  resizeCharts();

  renderList();

  await loadSymbol("BTCUSDT");
}

init();

</script>

</body>
</html>
