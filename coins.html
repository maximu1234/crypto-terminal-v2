<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Terminal V1.6 Infinite History</title>

<style>
body{
  margin:0;
  background:#0b1220;
  color:white;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

#app{
  display:grid;
  grid-template-columns: 1fr 240px;
  height:100vh;
}

#left{
  display:flex;
  flex-direction:column;
  height:100%;
}

#topbar{
  display:flex;
  gap:6px;
  padding:8px;
  border-bottom:1px solid #1f2937;
}

.tf-btn{
  background:#1f2937;
  border:none;
  color:white;
  padding:6px 10px;
  border-radius:6px;
  cursor:pointer;
}

.tf-btn.active{
  background:#2563eb;
}

#chart{
  flex:1;
}

#rsi{
  height:160px;
  border-top:1px solid #1f2937;
  background:#0f172a;
}

#list{
  border-left:1px solid #1f2937;
  overflow:auto;
}

.coin{
  padding:10px;
  border-bottom:1px solid #1f2937;
  cursor:pointer;
}

.active{
  background:#1e293b;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>

</head>

<body>

<div id="app">

  <div id="left">

    <div id="topbar">
      <button class="tf-btn active" data="15m">15m</button>
      <button class="tf-btn" data="1h">1h</button>
      <button class="tf-btn" data="4h">4h</button>
    </div>

    <div id="chart"></div>
    <div id="rsi"></div>

  </div>

  <div id="list"></div>

</div>

<script>

const symbols = ["BTCUSDT","ETHUSDT","SOLUSDT"];

let symbolIndex = 0;
let tf = "15m";

let chart;
let series;

let candles = [];
let oldestTime = null;
let loading = false;

/* ---------------- INIT ---------------- */

function initChart(){

  const container = document.getElementById("chart");

  chart = LightweightCharts.createChart(container, {
    layout:{
      background:{ color:"#0b1220" },
      textColor:"#d1d5db"
    },
    grid:{
      vertLines:{ color:"#161b26" },
      horzLines:{ color:"#161b26" }
    },
    timeScale:{
      borderColor:"#1f2937"
    }
  });

  series = chart.addCandlestickSeries();

  chart.timeScale().subscribeVisibleLogicalRangeChange(range => {
    if (!range || loading) return;

    if (range.from < 50) {
      loadMoreHistory();
    }
  });

  const resize = () => {
    chart.applyOptions({
      width: container.clientWidth,
      height: container.clientHeight
    });
  };

  window.addEventListener("resize", resize);
  resize();
}

/* ---------------- FETCH CHUNK ---------------- */

async function fetchChunk(symbol, endTime){

  let url = `https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${tf}&limit=1500`;

  if(endTime){
    url += `&endTime=${endTime}`;
  }

  const res = await fetch(url);
  const data = await res.json();

  return data.map(d => ({
    time: d[0] / 1000,
    open: +d[1],
    high: +d[2],
    low: +d[3],
    close: +d[4]
  }));
}

/* ---------------- INIT LOAD ---------------- */

async function loadSymbol(symbol){

  candles = await fetchChunk(symbol);

  series.setData(candles);

  oldestTime = candles[0].time * 1000;

  chart.timeScale().fitContent();
}

/* ---------------- LOAD MORE HISTORY ---------------- */

async function loadMoreHistory(){

  if (loading) return;
  loading = true;

  const symbol = symbols[symbolIndex];

  const more = await fetchChunk(symbol, oldestTime);

  if (more.length === 0) {
    loading = false;
    return;
  }

  oldestTime = more[0].time * 1000;

  candles = [...more, ...candles];

  series.setData(candles);

  loading = false;
}

/* ---------------- SYMBOLS ---------------- */

function renderList(){

  const list = document.getElementById("list");
  list.innerHTML = "";

  symbols.forEach((s,i)=>{

    const div = document.createElement("div");
    div.className = "coin" + (i===symbolIndex ? " active" : "");
    div.innerText = s;

    div.onclick = () => {
      symbolIndex = i;
      update();
    };

    list.appendChild(div);

  });

}

/* ---------------- UPDATE ---------------- */

async function update(){
  renderList();
  await loadSymbol(symbols[symbolIndex]);
}

/* ---------------- TF ---------------- */

document.querySelectorAll(".tf-btn").forEach(btn=>{
  btn.onclick = () => {

    document.querySelectorAll(".tf-btn")
      .forEach(b=>b.classList.remove("active"));

    btn.classList.add("active");

    tf = btn.dataset.data || btn.getAttribute("data");

    update();
  };
});

/* ---------------- START ---------------- */

initChart();
renderList();
update();

</script>

</body>
</html>
