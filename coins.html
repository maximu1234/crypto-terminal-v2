<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Multichart Terminal V1.2</title>

<style>
body{
  margin:0;
  background:#0b1220;
  color:white;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

#app{
  display:grid;
  grid-template-columns: 1fr 240px;
  height:100vh;
}

/* LEFT SIDE */
#left{
  display:flex;
  flex-direction:column;
  height:100%;
}

/* MAIN CHART */
#chart{
  flex: 1;
  width:100%;
  min-height:0;
}

/* RSI PLACEHOLDER (later we upgrade) */
#rsi{
  height:180px;
  border-top:1px solid #1f2937;
  background:#0f172a;
}

/* RIGHT LIST */
#list{
  border-left:1px solid #1f2937;
  overflow:auto;
}

.coin{
  padding:10px;
  border-bottom:1px solid #1f2937;
  cursor:pointer;
  font-weight:600;
}

.coin:hover{
  background:#111827;
}

.active{
  background:#1e293b;
}

/* HEADER */
.header{
  position:absolute;
  top:10px;
  left:10px;
  font-size:12px;
  color:#9ca3af;
  z-index:10;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>

</head>

<body>

<div class="header">
  Multichart Terminal V1.2 (Binance + Lightweight Charts FIXED VIEWPORT)
</div>

<div id="app">

  <div id="left">
    <div id="chart"></div>
    <div id="rsi"></div>
  </div>

  <div id="list"></div>

</div>

<script>

const symbols = [
  "BTCUSDT","ETHUSDT","SOLUSDT","XRPUSDT",
  "DOGEUSDT","ADAUSDT","AVAXUSDT","LINKUSDT","BNBUSDT"
];

let index = 0;

let chart;
let candleSeries;

/* ---------------- BINANCE DATA ---------------- */

async function fetchCandles(symbol){

  const res = await fetch(
    `https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=15m&limit=300`
  );

  const data = await res.json();

  return data.map(d => ({
    time: d[0] / 1000,
    open: +d[1],
    high: +d[2],
    low: +d[3],
    close: +d[4]
  }));
}

/* ---------------- INIT CHART ---------------- */

function initChart(){

  const container = document.getElementById("chart");

  chart = LightweightCharts.createChart(container, {
    layout: {
      background: { color: "#0b1220" },
      textColor: "#d1d5db"
    },
    grid: {
      vertLines: { color: "#161b26" },
      horzLines: { color: "#161b26" }
    },
    rightPriceScale: {
      borderColor: "#1f2937"
    },
    timeScale: {
      borderColor: "#1f2937",
      timeVisible: true,
      secondsVisible: false
    }
  });

  candleSeries = chart.addCandlestickSeries();

  /* 🔥 FIXED RESIZE (CRITICAL FOR VIEWPORT) */
  const resize = () => {
    const w = container.clientWidth;
    const h = container.clientHeight;

    chart.applyOptions({
      width: w,
      height: h
    });
  };

  window.addEventListener("resize", resize);
  resize();

}

/* ---------------- LOAD SYMBOL ---------------- */

async function loadSymbol(symbol){

  const candles = await fetchCandles(symbol);

  candleSeries.setData(candles);

  /* 🔥 KEY FIX: show more candles naturally */
  chart.timeScale().setVisibleLogicalRange({
    from: candles.length - 180,
    to: candles.length
  });

  setTimeout(() => {
    chart.timeScale().fitContent();
  }, 50);

}

/* ---------------- LIST ---------------- */

function renderList(){

  const list = document.getElementById("list");
  list.innerHTML = "";

  symbols.forEach((s,i)=>{

    const div = document.createElement("div");
    div.className = "coin" + (i === index ? " active" : "");
    div.innerText = s;

    div.onclick = () => {
      index = i;
      update();
    };

    list.appendChild(div);

  });

}

/* ---------------- UPDATE ---------------- */

async function update(){
  renderList();
  await loadSymbol(symbols[index]);
}

/* ---------------- KEYBOARD NAV ---------------- */

document.addEventListener("keydown",(e)=>{

  if(e.key === "ArrowDown"){
    index = Math.min(symbols.length - 1, index + 1);
    update();
  }

  if(e.key === "ArrowUp"){
    index = Math.max(0, index - 1);
    update();
  }

});

/* ---------------- START ---------------- */

initChart();
renderList();
update();

</script>

</body>
</html>
