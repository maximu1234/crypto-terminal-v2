<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Multichart Terminal V2.4</title>

<style>
html,body{
  margin:0;
  height:100%;
  background:#0b1220;
  font-family:Arial;
  color:white;
  overflow:hidden;
}

/* LAYOUT */
#app{
  display:grid;
  grid-template-columns: 1fr 240px;
  height:100vh;
}

#left{
  display:flex;
  flex-direction:column;
  min-height:0;
}

/* TOPBAR */
#topbar{
  display:flex;
  gap:6px;
  padding:8px;
  border-bottom:1px solid #1f2937;
  background:#0b1220;
}

.tf-btn{
  background:#1f2937;
  color:white;
  border:none;
  padding:6px 10px;
  border-radius:6px;
  cursor:pointer;
  font-size:12px;
}

.tf-btn.active{
  background:#2563eb;
}

/* CHART */
#chart{
  flex:1;
  min-height:0;
}

/* RIGHT LIST */
#list{
  border-left:1px solid #1f2937;
  overflow:auto;
}

.coin{
  padding:10px;
  border-bottom:1px solid #1f2937;
  cursor:pointer;
  color:white;
}

.coin:hover{
  background:#111827;
}

.active{
  background:#1e293b;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>

</head>

<body>

<div id="app">

  <div id="left">

    <!-- TIMEFRAMES RESTORED -->
    <div id="topbar">
      <button class="tf-btn active" data="5m">5m</button>
      <button class="tf-btn" data="15m">15m</button>
      <button class="tf-btn" data="1h">1h</button>
      <button class="tf-btn" data="4h">4h</button>
      <button class="tf-btn" data="1d">1D</button>
    </div>

    <div id="chart"></div>

  </div>

  <div id="list"></div>

</div>

<script>

const symbols = [
  "BTCUSDT","ETHUSDT","SOLUSDT",
  "XRPUSDT","DOGEUSDT","ADAUSDT",
  "AVAXUSDT","LINKUSDT","BNBUSDT"
];

let index = 0;
let tf = "15m";

let chart;
let series;

let candles = [];

/* ---------------- INIT ---------------- */

function initChart(){

  const el = document.getElementById("chart");

  chart = LightweightCharts.createChart(el, {
    layout:{
      background:{ color:"#0b1220" },
      textColor:"#d1d5db"
    },
    grid:{
      vertLines:{ color:"#161b26" },
      horzLines:{ color:"#161b26" }
    },
    timeScale:{
      borderColor:"#1f2937",
      timeVisible:true
    }
  });

  series = chart.addCandlestickSeries();

  window.addEventListener("resize", () => {
    chart.applyOptions({
      width: el.clientWidth,
      height: el.clientHeight
    });
  });

  resizeFix(el);

}

/* 🔥 SAFE RESIZE */
function resizeFix(el){
  requestAnimationFrame(() => {
    chart.applyOptions({
      width: el.clientWidth,
      height: el.clientHeight
    });
  });
}

/* ---------------- LOAD ---------------- */

async function load(symbol){

  const res = await fetch(
    `https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${tf}&limit=1500`
  );

  const data = await res.json();

  candles = data.map(d => ({
    time: d[0] / 1000,
    open: +d[1],
    high: +d[2],
    low: +d[3],
    close: +d[4]
  }));

  series.setData(candles);

  requestAnimationFrame(() => {
    chart.timeScale().fitContent();
  });
}

/* ---------------- LIST ---------------- */

function renderList(){

  const list = document.getElementById("list");
  list.innerHTML = "";

  symbols.forEach((s,i)=>{

    const div = document.createElement("div");
    div.className = "coin" + (i===index ? " active" : "");
    div.innerText = s;

    div.onclick = () => {
      index = i;
      load(s);
      renderList();
    };

    list.appendChild(div);

  });

}

/* ---------------- TF ---------------- */

function initTF(){

  document.querySelectorAll(".tf-btn").forEach(btn=>{
    btn.onclick = () => {

      document.querySelectorAll(".tf-btn")
        .forEach(b=>b.classList.remove("active"));

      btn.classList.add("active");

      tf = btn.dataset.data || btn.getAttribute("data");

      load(symbols[index]);
    };
  });
}

/* ---------------- START ---------------- */

initChart();
initTF();
renderList();
load(symbols[0]);

</script>

</body>
</html>
