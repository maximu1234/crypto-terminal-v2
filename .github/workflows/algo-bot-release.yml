name: Algo Bot release (macOS)

on:
  push:
    tags:
      - "algo-bot-v*"
  workflow_dispatch:
    inputs:
      bot_version:
        description: "Algo Bot semver (must match bot-app/package.json)"
        required: true
        default: "1.0.99"

concurrency:
  group: algo-bot-release-${{ github.event.inputs.bot_version && format('algo-bot-v{0}', github.event.inputs.bot_version) || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: bot-app

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Resolve algo-bot release tag and version
        id: release
        working-directory: .
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/algo-bot-v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#algo-bot-v}"
          else
            VERSION="${{ github.event.inputs.bot_version }}"
            TAG="algo-bot-v${VERSION}"
            PKG=$(node -p "require('./bot-app/package.json').version")
            if [ "$PKG" != "$VERSION" ]; then
              echo "Version mismatch: input=${VERSION}, package.json=${PKG}"
              exit 1
            fi
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Release target: ${TAG} (v${VERSION})"

      - name: Sync bot-app package version
        run: npm version "${{ steps.release.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Prepare supabase-env for site bundle
        working-directory: .
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ALERT_WORKER_URL: ${{ secrets.ALERT_WORKER_URL }}
          SYSTEM_ADMIN_EMAIL: ${{ secrets.SYSTEM_ADMIN_EMAIL }}
        run: |
          node scripts/write-supabase-env.cjs
          cp js/supabase-env.js bot-app/site-bundle/js/supabase-env.js

      - name: Build macOS Algo Bot (.dmg / .zip)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac --publish never

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: multichart-algo-bot-macos-${{ steps.release.outputs.version }}
          path: |
            bot-app/dist/*.dmg
            bot-app/dist/*.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/algo-bot-v')
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          VERSION="${RELEASE_VERSION}"
          REPO="${GITHUB_REPOSITORY}"
          ASSETS=(bot-app/dist/*.dmg bot-app/dist/*.zip)

          for asset in "${ASSETS[@]}"; do
            if [ ! -e "$asset" ]; then
              echo "Missing build asset: ${asset}"
              exit 1
            fi
          done

          publish() {
            if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
              echo "Release ${TAG} exists — uploading assets"
              gh release upload "$TAG" --repo "$REPO" "${ASSETS[@]}" --clobber
              return 0
            fi

            echo "Creating release ${TAG}"
            NOTES="$(printf '%s\n' \
              "Standalone **Multichart Algo Bot** (no Multichart app required)." \
              "" \
              "Cloud lock: requires Multichart account login + Supabase table \`algo_bot_lock\`.")"

            if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
              gh release create "$TAG" \
                --repo "$REPO" \
                --target "${GITHUB_SHA}" \
                --title "Algo Bot ${VERSION} (macOS)" \
                --notes "$NOTES" \
                "${ASSETS[@]}"
            else
              gh release create "$TAG" \
                --repo "$REPO" \
                --title "Algo Bot ${VERSION} (macOS)" \
                --notes "$NOTES" \
                "${ASSETS[@]}"
            fi
          }

          for attempt in 1 2 3 4 5; do
            if publish; then
              echo "Published ${TAG} (attempt ${attempt})"
              exit 0
            fi
            echo "Publish attempt ${attempt} failed — retry in 25s"
            sleep 25
          done

          echo "Publish failed after 5 attempts"
          exit 1
