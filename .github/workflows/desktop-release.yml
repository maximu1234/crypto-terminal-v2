name: Desktop release (macOS)

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Resolve desktop version from tag
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        run: |
          VERSION="${GITHUB_REF_NAME#desktop-v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Prepare supabase-env for site bundle
        working-directory: .
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ALERT_WORKER_URL: ${{ secrets.ALERT_WORKER_URL }}
          SYSTEM_ADMIN_EMAIL: ${{ secrets.SYSTEM_ADMIN_EMAIL }}
        run: node scripts/write-supabase-env.cjs

      - name: Bundle site into desktop
        run: npm run bundle:site

      - name: Build macOS .app + .dmg + auto-update zip
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run build:mac

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/latest-mac.yml
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          generate_release_notes: true

      - name: Upload artifacts (backup)
        uses: actions/upload-artifact@v4
        with:
          name: multichart-macos
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/latest-mac.yml
          if-no-files-found: error
