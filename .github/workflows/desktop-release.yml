name: Desktop release (macOS)

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  macos:
    runs-on: macos-latest
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Resolve desktop version and release tag
        id: release
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/desktop-v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#desktop-v}"
            npm version "$VERSION" --no-git-tag-version --allow-same-version
          else
            VERSION=$(node -p "require('./package.json').version")
            TAG="desktop-v${VERSION}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Prepare supabase-env for site bundle
        working-directory: .
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ALERT_WORKER_URL: ${{ secrets.ALERT_WORKER_URL }}
          SYSTEM_ADMIN_EMAIL: ${{ secrets.SYSTEM_ADMIN_EMAIL }}
        run: node scripts/write-supabase-env.cjs

      - name: Bundle site into desktop
        run: npm run bundle:site

      - name: Build macOS .app + .dmg + auto-update zip
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run build:mac

      - name: Publish GitHub Release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.release.outputs.tag }}"
          VERSION="${{ steps.release.outputs.version }}"
          ASSETS=(desktop/dist/*.dmg desktop/dist/*.zip desktop/dist/latest-mac.yml)

          publish() {
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG exists — uploading assets"
              gh release upload "$TAG" "${ASSETS[@]}" --clobber
            else
              echo "Creating release $TAG"
              gh release create "$TAG" \
                --title "Desktop ${VERSION}" \
                --target "${GITHUB_SHA}" \
                --generate-notes \
                "${ASSETS[@]}"
            fi
          }

          for attempt in 1 2 3 4 5; do
            if publish; then
              echo "Published $TAG (attempt ${attempt})"
              exit 0
            fi
            echo "Publish attempt ${attempt} failed — retry in 20s"
            sleep 20
          done

          echo "Publish failed after 5 attempts"
          exit 1

      - name: Upload artifacts (backup)
        uses: actions/upload-artifact@v4
        with:
          name: multichart-macos
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/latest-mac.yml
          if-no-files-found: error
