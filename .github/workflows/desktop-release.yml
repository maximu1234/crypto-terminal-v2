name: Desktop release (macOS)

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sync desktop version from tag
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        run: |
          VERSION="${GITHUB_REF_NAME#desktop-v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Prepare supabase-env for site bundle
        working-directory: .
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ALERT_WORKER_URL: ${{ secrets.ALERT_WORKER_URL }}
          SYSTEM_ADMIN_EMAIL: ${{ secrets.SYSTEM_ADMIN_EMAIL }}
        run: node scripts/write-supabase-env.cjs

      - name: Bundle site into desktop
        run: npm run bundle:site

      - name: Build macOS .app + .dmg + auto-update zip
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run build:mac

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: multichart-macos
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/latest-mac.yml
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#desktop-v}"
          REPO="${GITHUB_REPOSITORY}"
          ASSETS=(desktop/dist/*.dmg desktop/dist/*.zip desktop/dist/latest-mac.yml)

          for asset in "${ASSETS[@]}"; do
            if [ ! -e "$asset" ]; then
              echo "Missing build asset: ${asset}"
              exit 1
            fi
          done

          publish() {
            if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
              echo "Release ${TAG} exists — uploading assets"
              gh release upload "$TAG" --repo "$REPO" "${ASSETS[@]}" --clobber
            else
              echo "Creating release ${TAG}"
              gh release create "$TAG" \
                --repo "$REPO" \
                --title "Desktop ${VERSION}" \
                --generate-notes \
                "${ASSETS[@]}"
            fi
          }

          for attempt in 1 2 3 4 5; do
            if publish; then
              echo "Published ${TAG} (attempt ${attempt})"
              exit 0
            fi
            echo "Publish attempt ${attempt} failed — retry in 25s"
            sleep 25
          done

          echo "Publish failed after 5 attempts"
          exit 1
