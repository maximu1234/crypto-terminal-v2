name: Desktop release (macOS)

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      desktop_version:
        description: "Desktop semver (must match release-marker.js and desktop/package.json)"
        required: true
        default: "1.0.43"

concurrency:
  group: desktop-release-${{ github.event.inputs.desktop_version && format('desktop-v{0}', github.event.inputs.desktop_version) || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Resolve desktop release tag and version
        id: release
        working-directory: .
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/desktop-v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#desktop-v}"
          else
            VERSION="${{ github.event.inputs.desktop_version }}"
            TAG="desktop-v${VERSION}"
            PKG=$(node -p "require('./desktop/package.json').version")
            MARKER=$(node --input-type=module -e "import { DESKTOP_APP_VERSION } from './js/release-marker.js'; console.log(DESKTOP_APP_VERSION)")
            if [ "$PKG" != "$VERSION" ] || [ "$MARKER" != "$VERSION" ]; then
              echo "Version mismatch: input=${VERSION}, package.json=${PKG}, release-marker=${MARKER}"
              exit 1
            fi
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Release target: ${TAG} (v${VERSION})"

      - name: Verify desktop package version
        run: |
          set -euo pipefail
          PKG=$(node -p "require('./package.json').version")
          MARKER=$(node --input-type=module -e "import { DESKTOP_APP_VERSION } from '../js/release-marker.js'; console.log(DESKTOP_APP_VERSION)")
          VERSION="${{ steps.release.outputs.version }}"
          if [ "$PKG" != "$VERSION" ] || [ "$MARKER" != "$VERSION" ]; then
            echo "Version mismatch: tag=${VERSION}, package.json=${PKG}, release-marker=${MARKER}"
            exit 1
          fi
          echo "Desktop version OK: ${VERSION}"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Prepare supabase-env for site bundle
        working-directory: .
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ALERT_WORKER_URL: ${{ secrets.ALERT_WORKER_URL }}
          SYSTEM_ADMIN_EMAIL: ${{ secrets.SYSTEM_ADMIN_EMAIL }}
        run: node scripts/write-supabase-env.cjs

      - name: Bundle site into desktop
        run: npm run bundle:site

      - name: Build macOS editions f + m (.dmg / .zip)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run build:mac:editions

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: multichart-macos-${{ steps.release.outputs.version }}
          path: |
            desktop/dist/editions/*.dmg
            desktop/dist/editions/*.zip
            desktop/dist/editions/latest-mac.yml
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/desktop-v')
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          VERSION="${RELEASE_VERSION}"
          PKG=$(node -p "require('./desktop/package.json').version")
          REPO="${GITHUB_REPOSITORY}"
          ASSETS=(desktop/dist/editions/*.dmg desktop/dist/editions/*.zip desktop/dist/editions/latest-mac.yml)

          for asset in "${ASSETS[@]}"; do
            if [ ! -e "$asset" ]; then
              echo "Missing build asset: ${asset}"
              exit 1
            fi
          done

          # Artifact semver comes from package.json (npm must not normalize 1.1.01 → 1.1.1).
          ls desktop/dist/editions/*"${PKG}f"* >/dev/null
          ls desktop/dist/editions/*"${PKG}m"* >/dev/null

          publish() {
            if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
              echo "Release ${TAG} exists — uploading assets"
              gh release upload "$TAG" --repo "$REPO" "${ASSETS[@]}" --clobber
              return 0
            fi

            echo "Creating release ${TAG}"
            NOTES="$(printf '%s\n' \
              "### Editions" \
              "- **f** (full) — live + manual algo trading" \
              "- **m** (manual) — friends build, alerts only" \
              "" \
              "Download the file with \`f\` or \`m\` after the version in the name.")"

            if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
              gh release create "$TAG" \
                --repo "$REPO" \
                --target "${GITHUB_SHA}" \
                --title "Desktop ${VERSION}" \
                --notes "$NOTES" \
                "${ASSETS[@]}"
            else
              gh release create "$TAG" \
                --repo "$REPO" \
                --title "Desktop ${VERSION}" \
                --notes "$NOTES" \
                "${ASSETS[@]}"
            fi
          }

          for attempt in 1 2 3 4 5; do
            if publish; then
              echo "Published ${TAG} (attempt ${attempt})"
              exit 0
            fi
            echo "Publish attempt ${attempt} failed — retry in 25s"
            sleep 25
          done

          echo "Publish failed after 5 attempts"
          exit 1