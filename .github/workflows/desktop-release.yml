name: Desktop release (macOS)

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Resolve desktop version from tag
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        run: |
          VERSION="${GITHUB_REF_NAME#desktop-v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build macOS .app + .dmg + auto-update zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:mac:publish

      - name: Upload artifacts (backup)
        uses: actions/upload-artifact@v4
        with:
          name: multichart-macos
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/latest-mac.yml
          if-no-files-found: error
