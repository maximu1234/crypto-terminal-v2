<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Terminal Debug V1</title>

<style>
body{
  margin:0;
  background:#0b1220;
  color:white;
  font-family:Arial;
  overflow:hidden;
}

#app{
  display:grid;
  grid-template-columns: 1fr 220px;
  height:100vh;
}

#left{
  display:flex;
  flex-direction:column;
}

#chart{
  flex:3;
  background:#111827;
}

#rsi{
  flex:1;
  background:#0f172a;
  border-top:1px solid #1f2937;
}

#list{
  border-left:1px solid #1f2937;
  overflow:auto;
}

.coin{
  padding:10px;
  border-bottom:1px solid #1f2937;
  cursor:pointer;
}

.active{
  background:#1e293b;
}

#error{
  position:fixed;
  bottom:10px;
  left:10px;
  background:red;
  color:white;
  padding:10px;
  font-size:12px;
  display:none;
}
</style>

<script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>

</head>

<body>

<div id="app">

  <div id="left">
    <div id="chart"></div>
    <div id="rsi"></div>
  </div>

  <div id="list"></div>

</div>

<div id="error"></div>

<script>

function showError(msg){
  const el = document.getElementById("error");
  el.style.display="block";
  el.innerText = msg;
}

if(!window.LightweightCharts){
  showError("❌ LightweightCharts не загрузился (CDN issue)");
}

const symbols = [
  "BTCUSDT","ETHUSDT","SOLUSDT","XRPUSDT",
  "DOGEUSDT","ADAUSDT"
];

let index = 0;

let chart, candleSeries;

async function fetchCandles(symbol){

  try{

    const res = await fetch(
      `https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=15m&limit=100`
    );

    if(!res.ok){
      throw new Error("Binance API error: " + res.status);
    }

    const data = await res.json();

    return data.map(d => ({
      time: d[0]/1000,
      open: +d[1],
      high: +d[2],
      low: +d[3],
      close: +d[4]
    }));

  } catch(err){
    showError(err.message);
    return [];
  }
}

function initChart(){

  chart = LightweightCharts.createChart(document.getElementById("chart"),{
    layout:{
      background:{ color:"#0b1220" },
      textColor:"#d1d5db"
    },
    grid:{
      vertLines:{ color:"#161b26" },
      horzLines:{ color:"#161b26" }
    }
  });

  candleSeries = chart.addCandlestickSeries();

}

async function loadSymbol(symbol){

  const candles = await fetchCandles(symbol);

  if(!candles.length){
    showError("❌ Нет данных по " + symbol);
    return;
  }

  candleSeries.setData(candles);

}

function renderList(){

  const list = document.getElementById("list");
  list.innerHTML="";

  symbols.forEach((s,i)=>{

    const div = document.createElement("div");
    div.className="coin" + (i===index?" active":"");
    div.innerText=s;

    div.onclick=()=>{
      index=i;
      update();
    };

    list.appendChild(div);

  });

}

async function update(){

  renderList();

  await loadSymbol(symbols[index]);

}

initChart();
renderList();
update();

</script>

</body>
</html>
