<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin/>
<link rel="dns-prefetch" href="https://api.bybit.com"/>

<title>Терминал — Multichart</title>

<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/dashboard.css?v=4">

</head>

<body>

<header id="header">

<div id="logo">Multichart</div>

<nav class="menu">
<a href="/index.html">Главная</a>
<a href="/coins.html">Монеты</a>
<a href="/terminal.html" class="active">Терминал</a>
<a href="/alerts/">Алерты</a>
<a href="/listings.html">Листинги</a>
<a href="/trade-calculator.html">Калькулятор</a>
</nav>

<div id="header-controls">

<div class="control-group">
<span class="control-label">Виджеты</span>
<button type="button" class="layout-btn" data-layout="4">4</button>
<button type="button" class="layout-btn" data-layout="6">6</button>
<button type="button" class="layout-btn active" data-layout="9">9</button>
</div>

</div>

</header>

<main id="dashboard" class="grid-9"></main>

<script type="module">

import { loadLightweightCharts } from "./js/charts-lib-boot.js";

loadLightweightCharts().then(async ()=>{

await import("./js/site-boot.js?v=22");
await import("./js/dashboard.js?v=43");

}).catch(err=>{

console.error(err);

document.body.innerHTML = `
<div style="padding:32px;font-family:Arial,sans-serif;background:#0b1220;color:#fff;max-width:520px">
<h2>Не удалось загрузить графики</h2>
<p style="color:#fca5a5">${err.message}</p>
<p>Запустите <code>./start.sh</code> и откройте <a href="/terminal.html" style="color:#60a5fa">/terminal.html</a></p>
</div>`;

});

</script>

</body>
</html>
