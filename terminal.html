<script>
(function(){
var isDesktop=!!(window.cryptoTerminalDesktop&&window.cryptoTerminalDesktop.isDesktop);
var prefsKey=isDesktop?"trade_page_prefs_v1":"coins_page_prefs_v1";
function tabTitle(sym){
if(!sym){
return;
}
document.title=sym+" — Multichart";
}
var el=document.getElementById("current-symbol");
if(!el){
return;
}
var params=new URLSearchParams(location.search);
var fromUrl=params.get("symbol");
if(fromUrl){
var sym=fromUrl.trim().toUpperCase();
if(!/\.P$/i.test(sym)){
sym+=".P";
}
el.textContent=sym;
tabTitle(sym);
return;
}
try{
var raw=localStorage.getItem(prefsKey);
if(!raw){
return;
}
var prefs=JSON.parse(raw);
var market=prefs.market||"all";
var last=
prefs.lastViewByMarket&&
prefs.lastViewByMarket[market];
if(last&&last.symbol){
var saved=String(last.symbol).toUpperCase();
if(!/\.P$/i.test(saved)){
saved+=".P";
}
el.textContent=saved;
tabTitle(saved);
}
}catch(e){}
})();
</script>
