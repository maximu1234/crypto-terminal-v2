<body class="site-nav-page">

<header id="header" class="screener-page-header">

<a href="/index.html" id="logo">Multichart</a>

<div class="screener-mobile-bar site-mobile-bar">
<button type="button" class="screener-nav-toggle" id="site-nav-toggle" aria-label="Меню" aria-expanded="false" aria-controls="site-nav-panel">
<span class="screener-nav-toggle-bars" aria-hidden="true"></span>
</button>
</div>

<div class="screener-nav-backdrop hidden" id="site-nav-backdrop"></div>

<nav class="menu screener-nav-panel" id="site-nav-panel">

<main id="statistics-main">

<h1>Статистика</h1>

<p class="statistics-lead">
Топ-100 монет с наибольшим ростом цены на Bybit (USDT perpetual).
</p>

<div class="stats-toolbar">
<div class="stats-period-tabs" role="tablist" aria-label="Период">
<button type="button" class="stats-period-btn active" data-period="1d" role="tab" aria-selected="true">1 день</button>
<button type="button" class="stats-period-btn" data-period="1w" role="tab" aria-selected="false">1 неделя</button>
<button type="button" class="stats-period-btn" data-period="1m" role="tab" aria-selected="false">1 месяц</button>
<button type="button" class="stats-period-btn" data-period="1y" role="tab" aria-selected="false">1 год</button>
</div>
<button type="button" id="statistics-refresh" class="stats-refresh-btn">Обновить данные</button>
</div>

<div id="statistics-status"></div>

<div class="stats-table-wrap">
<div class="stats-table-head">
<div class="stats-col-symbol">Топ-100</div>
<div class="stats-col-bar" aria-hidden="true"></div>
<div class="stats-col-move">Движение цены</div>
</div>
<div id="statistics-rows" class="stats-rows"></div>
</div>

</main>
