</head>

<body class="site-nav-page trade-diary-body">

<header id="header" class="app-page-header">

<a href="/screener.html" id="logo" aria-label="Multichart"><img src="/icons/brand-logo.png" alt="" width="32" height="32" class="site-logo-img" decoding="async"></a>


<nav class="menu app-header-nav" id="app-header-nav">
<a href="/screener.html">Скринер</a>
<a href="/terminal.html">Терминал</a>
<a href="/watchlist.html">Вотчлист</a>

<a href="/statistics.html">Статистика</a>
</nav>

</header>

<div id="trade-diary-root" class="trade-diary-shell">

<div id="trade-diary-denied-desktop" class="trade-diary-gate hidden">
<h1>Дневник недоступен</h1>
<p>Войдите на сайт, чтобы открыть дневник сделок Bybit.</p>
</div>

<main id="trade-diary-panel" class="trade-diary-page hidden">

<div class="trade-diary-page-head">
<h1>Дневник</h1>
<div class="trade-diary-page-head-actions">
<button type="button" class="trade-diary-period-trigger" id="trade-diary-period-btn" aria-haspopup="dialog">
<svg class="trade-diary-period-trigger-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 3v4M16 3v4M3 10h18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
<span data-period-label>Период</span>
</button>
<button type="button" class="trade-diary-refresh" id="trade-diary-refresh">Обновить</button>
<div class="trade-diary-download-wrap" id="trade-diary-download-wrap">
<button type="button" class="trade-diary-refresh trade-diary-download-btn" id="trade-diary-download-btn" aria-haspopup="menu" aria-expanded="false">Скачать</button>
<div class="trade-diary-download-menu hidden" id="trade-diary-download-menu" role="menu">
<button type="button" role="menuitem" data-download="json">Дневник (.json)</button>
<button type="button" role="menuitem" data-download="excel">Excel (.xls)</button>
</div>
</div>
<button type="button" class="trade-diary-refresh" id="trade-diary-upload-btn">Загрузить дневник</button>
<input type="file" id="trade-diary-upload-input" accept="application/json,.json" hidden/>
</div>
</div>

<p id="trade-diary-status" class="trade-diary-status" aria-live="polite"></p>

<div id="trade-diary-analytics" class="trade-diary-analytics is-collapsed" hidden></div>

<div id="trade-diary-content" class="trade-diary-content"></div>

</main>

</div>

<script type="module" src="/js/site-boot.js?v=136"></script>
<script type="module" src="/js/trade-diary-page.js?v=46"></script>

</body>
</html>
